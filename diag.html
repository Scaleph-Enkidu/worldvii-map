    await sleep(300);
    $('go').disabled = false; $('go').textContent = '点这里开始诊断 START';
  })();

  $('go').addEventListener('click', function () {
    if ($('go').disabled) return; $('go').disabled = true; tapAt = now(); R.size1 = sizes();
    // —— 以下几行都在“手指点下去”的那一刻里执行 ——
    var g1 = mkV(), u1 = mkV(), u2 = mkV(), late = mkV();
    [g1, u1, u2, late].forEach(function (v, i) { v.style.cssText = 'position:fixed;left:-200px;top:' + (i * 95) + 'px;width:160px;height:90px'; document.body.appendChild(v); });
    g1.src = blobs.a_clip;
    var pG = playTest(g1, 3000);                                   // 点按当下、已经装好视频：播
    var uState = {};
    [u1, u2].forEach(function (v) { try { var p = v.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} });   // 正式网页的“先解锁”：空播放器先调一次播放
    uState.afterUnlock = [u1.paused, u2.paused];
    // 测解码的八个播放器：点按当下各调一次播放再停，之后由程序发起的播放就不该被拦
    for (var k in dv) { try { var p2 = dv[k].play(); if (p2 && p2.catch) p2.catch(function () {}); dv[k].pause(); } catch (e) {} }
    run(pG, g1, u1, u2, late, uState).catch(function (e) { R.log.push('流程出错: ' + e.name + ' ' + e.message); finish(); });
  });

  async function run(pG, g1, u1, u2, late, uState) {
    var say = function (s) { $('go').textContent = s; };
    say('测试中 0/' + V.length + '（别碰屏幕）');
    policy.inTap = await pG; try { g1.pause(); } catch (e) {} g1.remove();
    // 逐支测解码
    R.video = {};
    for (var i = 0; i < V.length; i++) {
      var s = V[i], v = dv[s.id], r = { spec: s.w + 'x' + s.h + '@' + s.fps + ' L' + s.level + ' ref' + s.ref };
      say('测试中 ' + (i + 1) + '/' + V.length + '（别碰屏幕）');
      r.canPlay = v.canPlayType('video/mp4; codecs="' + s.codec + '"') || 'no';
      if (R.feat.mediaCap) { try { var d = await navigator.mediaCapabilities.decodingInfo({ type: 'file', video: { contentType: 'video/mp4; codecs="' + s.codec + '"', width: s.w, height: s.h, bitrate: s.bitrate, framerate: s.fps } });
        r.cap = (d.supported ? 'S' : 's') + (d.smooth ? 'M' : 'm') + (d.powerEfficient ? 'P' : 'p'); } catch (e) { r.cap = 'err ' + e.name; } }
      if (!blobs[s.id]) { r.play = { promise: '没下载到' }; R.video[s.id] = r; continue; }
      try { v.currentTime = 0; } catch (e) {}
      r.play = await playTest(v, s.dur * 1000 + 4500);
      try { v.pause(); } catch (e) {}
      R.video[s.id] = r; await sleep(250);
    }
    // 点按过去 6 秒以上再测“程序自己发起的播放”
    var wait = 6200 - (now() - tapAt); if (wait > 0) { say('再等几秒（别碰屏幕）'); await sleep(wait); }
    policy.touchedDuring = lastTouch > tapAt + 400;
    late.src = blobs.a_clip; policy.lateFresh = await playTest(late, 3000); try { late.pause(); } catch (e) {} late.remove();
    // 正式网页现在的流程：解锁过的空播放器 → 装视频 → load() → play()
    uState.beforeSrc = [u1.paused, u2.paused];
    u1.src = blobs.a_clip; uState.u1AfterSrc = u1.paused; u1.load(); uState.u1AfterLoad = u1.paused;
    policy.siteFlow = await playTest(u1, 3000); try { u1.pause(); } catch (e) {} u1.remove();
    // 同样解锁过，但只装视频、不调 load() 也不调 play()：看它会不会自己播
    u2.src = blobs.a_clip; var t0 = now(); while (now() - t0 < 2500 && !(u2.currentTime > 0.05)) await sleep(60);
    policy.srcOnly = { started: u2.currentTime > 0.05, t: +u2.currentTime.toFixed(2), paused: u2.paused, err: errOf(u2) }; try { u2.pause(); } catch (e) {} u2.remove();
    policy.unlock = uState;
    finish();
  }

  function finish() {
    R.policy = policy; R.size2 = sizes(); R.seen = seen; R.zoomMax = zMax;
    var mark = function (ok, warn) { return ok ? '✓' : (warn ? '△' : '✗'); };
    var pol = function (p) { if (!p) return '没测'; if (p.skipped) return p.skipped; if (p.playingAt !== null && p.playingAt !== undefined && p.t > 0.05) return '✓ 能播(' + p.playingAt + 'ms)';
      return '✗ ' + p.promise + (p.err ? ' ' + p.err : '') + (p.paused ? ' 停着' : ' 没停但不走'); };
    var s = R.size2, L = [];
    L.push(VER + '  ' + R.time.slice(0, 16));
    L.push('窗口 ' + s.inner.join('×') + '｜整页 ' + s.client.join('×') + '｜可见 ' + (s.vv ? s.vv.w + '×' + s.vv.h + ' ×' + s.vv.scale : '?') + '｜屏 ' + s.screen.join('×') + ' @' + s.dpr);
    L.push('单位 vh' + s.units.vh + ' svh' + s.units.svh + ' lvh' + s.units.lvh + ' dvh' + s.units.dvh + ' 100%' + s.units.pct + '｜留边 上' + s.safe.top + ' 右' + s.safe.right + ' 下' + s.safe.bottom + ' 左' + s.safe.left);
    L.push('窗口高出现过 ' + seen.ih.join('/') + '｜放大倍数出现过 ' + (seen.sc.join('/') || '?'));
    L.push('自动播放：没碰屏幕 ' + pol(policy.noTouch));
    L.push('　点按当下 ' + pol(policy.inTap) + '｜6 秒后新播放器 ' + pol(policy.lateFresh));
    L.push('　网站现用流程 ' + pol(policy.siteFlow) + '（解锁后停着=' + (policy.unlock ? policy.unlock.afterUnlock[0] + '→装视频' + policy.unlock.u1AfterSrc + '→load ' + policy.unlock.u1AfterLoad : '?') + '）｜只装不播 ' + (policy.srcOnly ? (policy.srcOnly.started ? '✓ 自己播了' : '✗ 没动') : '?'));
    if (policy.touchedDuring) L.push('　注意：测试期间碰过屏幕，上面“6 秒后”几项不准');
    var vl = [];
    V.forEach(function (sp) { var r = R.video && R.video[sp.id]; if (!r) { vl.push(sp.id.slice(0, 1) + ' 没测'); return; } var p = r.play, full = p.endedAt !== null && p.endedAt !== undefined;
      var slow = full && (p.endedAt - (p.playingAt || 0)) > sp.dur * 1000 * 1.35;
      vl.push(sp.id.slice(0, 1) + ' ' + sp.w + 'x' + sp.h + '@' + sp.fps + ' L' + sp.level.toFixed(1) + ' ' + (full ? mark(!slow, true) : '✗') + ' ' + (full ? ('起播' + p.playingAt + ' 放完' + p.endedAt + ' ' + (p.frames || '?') + '帧' + (p.dropped ? ' 丢' + p.dropped : '')) : (p.promise + (p.err ? ' ' + p.err : '') + ' 走到' + p.t + 's')) + ' [' + (r.cap || '-') + ']'); });
    L.push('视频（毫秒；应放完约 1500）：'); vl.forEach(function (x) { L.push('　' + x); });
    L.push('深色：系统深色 ' + R.env.dark + '｜浏览器强改 ' + R.env.forceDark + '（' + R.env.canvasColor + '）');
    L.push('功能：cqw ' + mark(R.feat.cqw) + ' dvh ' + mark(R.feat.dvh) + ' 触摸声明 ' + mark(R.feat.touchAction) + ' WebP ' + mark(R.feat.webp) + ' WebGL ' + mark(R.feat.webgl) + ' 解密 ' + mark(R.feat.aesgcm) + ' 省流量 ' + R.env.saveData + ' 触屏 ' + R.env.coarse);
    L.push('UA ' + R.env.ua);
    if (R.env.uach) L.push('机型 ' + R.env.uach.model + '｜' + R.env.uach.os + '｜' + R.env.uach.brands);
    if (R.log.length) L.push('日志 ' + R.log.join(' ; '));
    $('sum').textContent = L.join('\n');
    var full = L.join('\n') + '\n\n----- 原始数据 -----\n' + JSON.stringify(R);
    $('out').value = full; $('copy').style.display = ''; $('go').textContent = '跑完了：截这一屏，再点“复制结果”'; $('go').style.cssText = 'padding:5px 8px;font-size:12px;margin:3px 0'; $('tip').style.display = 'none'; R.done = true; window.__diag = R;
  }
  $('copy').addEventListener('click', function () {
    var t = $('out'), ok = function () { $('copied').textContent = ' 已复制，粘贴发给作者'; }, old = function () { try { t.removeAttribute('readonly'); t.focus(); t.select(); t.setSelectionRange(0, t.value.length); var r = document.execCommand('copy'); t.setAttribute('readonly', ''); if (r) ok(); else $('copied').textContent = ' 复制不了：长按下面的文本框全选复制'; } catch (e) { $('copied').textContent = ' 复制不了：长按下面的文本框全选复制'; } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(ok, old); else old();
  });
  window.__diag = R;
})();
</script>
