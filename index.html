<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e141c">
<title>世界Ⅶ / WORLD VII</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=689e8fa6">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=7c453871">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=fba1f5df">
<link rel="stylesheet" href="lib/leaflet.css?v=ec929f11">
<style>
  :root { --ink: #ece7dc; --panel: rgba(12, 17, 24, .80); --line: rgba(236, 231, 220, .22); }
  html, body { margin: 0; height: 100%; background: #0e141c; color: var(--ink); overflow: hidden;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif; }
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; transform-origin: 0 0; }
  #map { position: absolute; inset: 0; background: #0e141c; }
  .leaflet-container { background: transparent; font-family: inherit; }
  .leaflet-tile:not([src]) { visibility: hidden !important; }          /* 画像の無いタイルは見せない（白い枠が出る） */
  .leaflet-tile, #map img { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 3px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 13px;
    font-weight: 600; padding: 7px 12px; border-radius: 17px; line-height: 1.1; white-space: nowrap; }
  .seg button small { display: block; font-size: 9px; font-weight: 500; letter-spacing: .12em; opacity: .75; }
  .seg button.on { background: var(--ink); color: #0e141c; }
  .seg button:disabled { opacity: .3; }
  #top { position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%); top: 10px; }
  #bottom { position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%); bottom: 12px;
    display: flex; gap: 6px; }
  #title { position: absolute; z-index: 1000; left: 14px; top: 12px;
    font-size: 11px; letter-spacing: .18em; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 4px 10px; color: rgba(236, 231, 220, .85); }
  #msg { position: absolute; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-size: 16px; line-height: 1.8; background: #0e141c; }
  #msg.show { display: flex; }
  .lbl { color: #f3eee4; text-shadow: 0 0 3px #000, 0 0 6px #000, 0 1px 2px #000; white-space: nowrap; font-weight: 600;
    letter-spacing: .06em; transform: translate(-50%, -50%); display: inline-block; pointer-events: none; }
  .lbl.area { font-size: 12px; letter-spacing: .28em; font-style: italic; opacity: .92; }
  .lbl.dot, .lbl.site, .lbl.zone { font-size: 11px; }
  .lbl .mk { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #f3eee4; margin-right: 5px;
    vertical-align: middle; box-shadow: 0 0 3px #000; }
  .lbl.site .mk { border-radius: 1px; transform: rotate(45deg); background: #e8c070; }
  .lbl.zone .mk { background: transparent; border: 2px solid #e0705a; width: 6px; height: 6px; }
  .lbl.zone { color: #f6d2c8; }
  .lbl.eden { font-size: 13px; color: #d9f2c8; letter-spacing: .2em; }
  .lbl.fly { pointer-events: auto; cursor: pointer; }
  .leaflet-div-icon { background: transparent; border: 0; }
  /* 細い書体（ページに同梱。外部のフォント配信には頼らない） */
  @font-face { font-family: "Jost"; src: url("lib/fonts/jost-400.woff2?v=a61b232f") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Jost"; src: url("lib/fonts/jost-200.woff2?v=2bdfa208") format("woff2"); font-weight: 200; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("lib/fonts/ibm-plex-mono-300.woff2?v=7b9722e5") format("woff2"); font-weight: 300; font-display: swap; }
  @font-face { font-family: "Noto Sans JP Sub"; src: url("lib/fonts/noto-sans-jp-400-notes.woff2?v=035f7e35") format("woff2"); font-weight: 400; font-display: swap; unicode-range: U+304C, U+305F, U+3063, U+306E, U+30B3, U+30C6, U+30CA, U+30F3, U+4E0A, U+4E8C, U+5168, U+56FD, U+57CE, U+589F, U+5C04, U+5E02, U+5E55, U+5E72, U+5E95, U+5EC3, U+6559, U+6761, U+6D77, U+6E9D, U+7167, U+72B6, U+76F4, U+7DDA, U+8239, U+90FD, U+9244, U+9577; }
  @font-face { font-family: "Noto Sans JP Sub"; src: url("lib/fonts/noto-sans-jp-200-subset.woff2?v=329475f9") format("woff2"); font-weight: 200; font-display: swap; }
  :root { --fx-ink: #eef2f5; --fx-dim: rgba(238, 242, 245, .52); --fx-glow: 150, 205, 255; --fx-rule: rgba(238, 242, 245, .24);
    --fx-shade: 0 0 .6em rgba(4, 8, 12, .8);
    --f-label: "Jost", "Futura", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
    --f-data: "IBM Plex Mono", "SFMono-Regular", Consolas, "Courier New", monospace;
    --f-jp: "Noto Sans JP Sub", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; }
  #stage { container-type: size; }

  /* タップできる地名：丸い印から波紋が広がり続ける */
  .lbl .rp { display: inline-block; position: relative; width: 7px; height: 7px; margin-right: 8px; vertical-align: middle; border-radius: 50%;
    background: #fff; box-shadow: 0 0 6px rgba(var(--fx-glow), .95), 0 0 2px #fff; }
  .lbl .rp::before, .lbl .rp::after { content: ""; position: absolute; inset: -1px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .95);
    animation: rip 2.4s cubic-bezier(.2, .6, .3, 1) infinite; }
  .lbl .rp::after { animation-delay: 1.2s; }
  @keyframes rip { from { transform: scale(1); opacity: .95; } to { transform: scale(4.6); opacity: 0; } }

  /* 降下後の情報表示：片側の暗幕、紹介文、引き出し線つきの地名 */
  /* 暗幕：側（左右）の背景を付けてから .on で淡く現れる（背景が無いうちに透明度だけ先に上げない） */
  #scrim { position: absolute; inset: 0; z-index: 610; pointer-events: none; opacity: 0; }
  #scrim.right { background: linear-gradient(to right, rgba(8, 12, 18, 0) 44%, rgba(8, 12, 18, .62) 65%, rgba(8, 12, 18, .86) 100%); }
  #scrim.left { background: linear-gradient(to left, rgba(8, 12, 18, 0) 44%, rgba(8, 12, 18, .62) 65%, rgba(8, 12, 18, .86) 100%); }
  #scrim.on { opacity: 1; transition: opacity .9s ease; }
  #intro { position: absolute; z-index: 620; top: 9%; width: 42%; display: flex; flex-direction: column; gap: 1.1cqw; pointer-events: none;
    color: var(--fx-ink); text-shadow: var(--fx-shade); transition: opacity .35s ease; }
  #intro.right { right: 2.8%; }
  /* 左側のときは、左上の「戻る」「情報」ボタンの下から始める */
  #intro.left { left: 2.8%; top: max(9%, 64px); }
  #intro .eyebrow { font: 300 max(8.5px, 1.12cqw)/1 var(--f-data); letter-spacing: .26em; color: var(--fx-dim); }
  #intro .name { font: 200 max(20px, 3cqw)/1 var(--f-label); letter-spacing: .24em; margin: 0; }
  #intro .sub { font: 300 max(9.5px, 1.3cqw)/1.4 var(--f-jp); letter-spacing: .34em; color: var(--fx-dim); }
  #intro .rule { height: 1px; transform-origin: left center; transform: scaleX(0); box-shadow: 0 0 .5cqw rgba(var(--fx-glow), .35);
    background: linear-gradient(to right, rgba(238, 242, 245, .7), var(--fx-rule) 30%, var(--fx-rule)); }
  #intro .body { display: flex; flex-direction: column; gap: .5cqw; font: 300 max(10px, 1.32cqw)/1.85 var(--f-jp); letter-spacing: .08em; }
  #intro .data { display: flex; flex-direction: column; gap: .3cqw; font: 300 max(9px, 1.15cqw)/1.7 var(--f-data); letter-spacing: .08em; }
  #intro .data .k { color: var(--fx-dim); }
  .note { position: absolute; left: 0; top: 0; width: 0; height: 0; color: var(--fx-ink); text-shadow: var(--fx-shade); pointer-events: none; transition: opacity .35s ease; }
  .note svg { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; filter: drop-shadow(0 0 3px rgba(var(--fx-glow), .6)); }
  .note polyline { fill: none; stroke: #fff; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .note .dot { position: absolute; left: -3.5px; top: -3.5px; width: 7px; height: 7px; box-sizing: border-box; border: 1px solid #fff; border-radius: 50%;
    box-shadow: 0 0 6px rgba(var(--fx-glow), .9); transform: scale(0); }
  .note .nt { position: absolute; white-space: nowrap; }
  .note .en { font: 300 11px/1 var(--f-label); letter-spacing: .22em; position: absolute; left: 0; bottom: 6px; }
  .note .jp { font: 300 9.5px/1 var(--f-jp); letter-spacing: .1em; color: var(--fx-dim); position: absolute; left: 0; top: 6px; }
  .noinfo #intro, .noinfo .note { opacity: 0; }
  .noinfo #scrim.on { opacity: 0; transition: opacity .35s ease; }
  /* 戻るとき：暗幕・紹介文・地名を先に淡く消す（「戻る」「情報」は .flyend を外すと淡く消える） */
  .leaving #scrim.on { opacity: 0; transition: opacity .4s ease; }
  .leaving #intro, .leaving .note { opacity: 0; }
  /* 文字が湧き出す効果：1 文字 1 マス。マス幅は最終の文字幅（em）で固定するので、乱数文字が跳ねても行は揺れない */
  .sx { display: block; white-space: pre; }
  .sx .c { display: inline-block; text-align: center; overflow: hidden; vertical-align: bottom; }
  .sx .c.wait { visibility: hidden; }
  .sx .c.hot { color: #fff; text-shadow: 0 0 .16em rgba(255, 255, 255, .95), 0 0 .65em rgba(var(--fx-glow), .8), 0 0 1.7em rgba(var(--fx-glow), .42); }
  .sx .c.lock { animation: fxlock .5s ease-out both; }
  @keyframes fxlock {
    from { color: #fff; text-shadow: 0 0 .16em rgba(255, 255, 255, .9), 0 0 .8em rgba(var(--fx-glow), .7), 0 0 1.9em rgba(var(--fx-glow), .35); }
    to { text-shadow: var(--fx-shade); }
  }
  #infoBtn { position: absolute; z-index: 1600; left: 100px; top: 12px; appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 18px;
    line-height: 1.1; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #infoBtn small { display: block; font-size: 9px; font-weight: 500; letter-spacing: .12em; opacity: .75; }
  /* 「戻る」「情報」：ぱっと出さず、淡く現れて少し下りてくる。隠れている間は押せない */
  #back, #infoBtn { display: block; opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-8px);
    transition: opacity .45s ease, transform .45s ease, visibility 0s linear .45s; }
  .flyend #back, .flyend #infoBtn { opacity: 1; visibility: visible; pointer-events: auto; transform: none;
    transition: opacity .6s ease .15s, transform .6s cubic-bezier(.2, .7, .2, 1) .15s, visibility 0s; }
  .flyend #infoBtn { transition-delay: .27s, .27s, 0s; }
  .flyend.noinfo #infoBtn { opacity: .55; }

  #flyv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none;
    transition: opacity .4s ease; z-index: 1500; }
  #flyv.show { opacity: 1; }
  #top, #bottom, #title { transition: opacity .3s ease; }
  .flying #top, .flying #bottom, .flying #title { opacity: 0; pointer-events: none; }
  #back { position: absolute; z-index: 1600; left: 14px; top: 12px; appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 18px;
    line-height: 1.1; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #back small { display: block; font-size: 9px; font-weight: 500; letter-spacing: .12em; opacity: .75; }
  /* 高さを 8 倍に強調していることの注記（左下）。降下中は消し、エデンの終点では出す。沿岸の廃墟は実寸なので出さない */
  #vx { position: absolute; z-index: 1000; left: 14px; bottom: 14px; pointer-events: none; font-size: 10px; letter-spacing: .14em; line-height: 1.5;
    color: rgba(236, 231, 220, .82); text-shadow: 0 0 3px #000, 0 0 6px #000; transition: opacity .3s ease; }
  #vx small { display: block; font-size: 8.5px; letter-spacing: .2em; opacity: .8; }
  .flying #vx { opacity: 0; }
  .flyend.fly-eden #vx { opacity: 1; }
  /* 戦前⇔戦後の切替映像（地図に重ねる）：淡く現れて淡く消える */
  .seafx { opacity: 0; transition: opacity .3s ease; pointer-events: none; }
  .seafx.show { opacity: 1; }
  /* 年の表示（右上）：SA の PV の年カウンターと同じ作り（細い数字、速く変わる桁は縦に流れる、確定で一度光る、下に YEAR） */
  #yr { position: absolute; z-index: 1000; right: 18px; top: 12px; pointer-events: none; opacity: 0; transition: opacity .35s ease; text-align: center;
    color: var(--fx-ink); text-shadow: 0 0 4px rgba(4, 8, 12, .9), 0 0 12px rgba(4, 8, 12, .7); }
  #yr.show { opacity: 1; }
  #yr .n { font: 200 max(30px, 4.6cqw)/1 var(--f-label); letter-spacing: .02em; white-space: nowrap; }
  #yr .d { display: inline-block; width: .6em; text-align: center; }
  #yr .d.b1 { opacity: .8; text-shadow: 0 -.10em .06em rgba(238, 242, 245, .45), 0 .10em .06em rgba(238, 242, 245, .45); }
  #yr .d.b2 { opacity: .55; text-shadow: 0 -.20em .10em rgba(238, 242, 245, .5), 0 .20em .10em rgba(238, 242, 245, .5), 0 -.36em .16em rgba(238, 242, 245, .25), 0 .36em .16em rgba(238, 242, 245, .25); }
  #yr .r { height: 1px; margin: .5cqw auto 0; width: 62%; background: var(--fx-rule); }
  #yr .c { font: 300 max(8px, .95cqw)/1 var(--f-data); letter-spacing: .5em; margin: .5cqw 0 0 .5em; color: var(--fx-dim); }
  #yr.lock .n { animation: yrlock .9s ease-out both; }
  @keyframes yrlock { from { color: #fff; text-shadow: 0 0 .12em rgba(255, 255, 255, .95), 0 0 .5em rgba(var(--fx-glow), .85), 0 0 1.4em rgba(var(--fx-glow), .45); }
    to { text-shadow: 0 0 4px rgba(4, 8, 12, .9), 0 0 12px rgba(4, 8, 12, .7); } }
  .flying #yr { opacity: 0; }
  /* 地形図は地が明るいので、注記と年は濃い字にする */
  .relief #vx { color: #1f252d; text-shadow: none; font-weight: 500; }
  .relief #yr { color: #232a33; text-shadow: 0 0 6px rgba(255, 255, 255, .5); }
  .relief #yr .d.b1 { text-shadow: 0 -.10em .06em rgba(35, 42, 51, .4), 0 .10em .06em rgba(35, 42, 51, .4); }
  .relief #yr .d.b2 { text-shadow: 0 -.20em .10em rgba(35, 42, 51, .45), 0 .20em .10em rgba(35, 42, 51, .45), 0 -.36em .16em rgba(35, 42, 51, .22), 0 .36em .16em rgba(35, 42, 51, .22); }
  .relief #yr .r { background: rgba(35, 42, 51, .3); }
  .relief #yr .c { color: rgba(35, 42, 51, .6); }
  .relief #yr.lock .n { animation: yrlockd .9s ease-out both; }
  @keyframes yrlockd { from { color: #000; text-shadow: 0 0 .5em rgba(255, 255, 255, .95), 0 0 1.4em rgba(255, 255, 255, .7); } to { text-shadow: 0 0 6px rgba(255, 255, 255, .5); } }
  /* ===== 第 11 版 ===== */
  /* タップできる地名：波紋の点は地図上の正確な位置に置き、名前はその真上に中央揃えで出す */
  .lbl.pin { display: inline-flex; flex-direction: column; align-items: center; transform: translate(-50%, calc(-100% + 3.5px)); }
  .lbl.pin .rp { margin: 6px 0 0; }
  .lbl.corp { font-size: 12px; letter-spacing: .22em; }
  /* 俯瞰⇔45° の切替映像：画面の中央に置き、再生に合わせて大きさを変える */
  #tiltv { position: absolute; left: 50%; top: 50%; z-index: 800; transform: translate(-50%, -50%); opacity: 0; pointer-events: none;
    transition: opacity .16s ease; max-width: none; }
  #tiltv.show { opacity: 1; }
  /* 切替の途中は操作を受け付けない */
  .busy #top, .busy #bottom, .busy #moreBtn { pointer-events: none; }
  /* 戦前の四大企業：本社をタップしたときの紹介（降下後の紹介欄と同じ作り） */
  #intro.corp { gap: 1cqw; }
  #intro.corp .logo { height: max(46px, 8.5cqw); max-width: 70%; object-fit: contain; object-position: left center; align-self: flex-start;
    opacity: 0; transition: opacity .6s ease; filter: drop-shadow(0 0 .6em rgba(4, 8, 12, .7)); margin-bottom: .6cqw; }
  #intro.corp .logo.on { opacity: 1; }
  #intro.corp .name { letter-spacing: .3em; }
  #corpx { position: absolute; z-index: 1600; left: 14px; top: 12px; appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 18px;
    line-height: 1.1; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-8px); transition: opacity .4s ease, transform .4s ease, visibility 0s linear .4s; }
  #corpx small { display: block; font-size: 9px; font-weight: 500; letter-spacing: .12em; opacity: .75; }
  .corp-open #corpx { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition: opacity .5s ease .1s, transform .5s cubic-bezier(.2, .7, .2, 1) .1s, visibility 0s; }
  .corp-open #title { opacity: 0; }
  /* 詳細：右下のボタン → 右から出るメニュー → 全画面のページ */
  #moreBtn { position: absolute; z-index: 1000; right: 14px; bottom: 12px; appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px 7px 15px; border-radius: 20px;
    line-height: 1.1; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; gap: 9px; text-align: left;
    transition: opacity .3s ease; }
  #moreBtn small { display: block; font-size: 9px; font-weight: 500; letter-spacing: .12em; opacity: .75; }
  #moreBtn i { font: 200 22px/1 var(--f-label); font-style: normal; transform: translateY(-1px); }
  .flying #moreBtn, .side-open #moreBtn, .corp-open #moreBtn { opacity: 0; pointer-events: none; }
  #sideShade { position: absolute; inset: 0; z-index: 1690; background: rgba(4, 8, 12, .42); opacity: 0; pointer-events: none; transition: opacity .4s ease; }
  .side-open #sideShade { opacity: 1; pointer-events: auto; }
  #side { position: absolute; z-index: 1700; top: 0; right: 0; height: 100%; width: max(30%, 236px); box-sizing: border-box; overflow: hidden;
    transform: translateX(103%); color: var(--fx-ink); background: rgba(11, 16, 22, .9); border-left: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform .45s cubic-bezier(.2, .7, .2, 1), width .55s cubic-bezier(.3, .7, .2, 1), background-color .4s ease, border-color .4s ease; }
  .side-open #side { transform: none; }
  .side-full #side { width: 100%; background: rgb(11, 16, 22); border-left-color: transparent; }
  /* 左端の右向き矢印：全画面のときはメニューへ戻り、メニューのときは閉じる */
  #sideBack { position: absolute; z-index: 3; left: 0; top: 0; bottom: 0; width: 46px; appearance: none; border: 0; background: transparent; color: var(--fx-ink);
    font: 200 30px/1 var(--f-label); display: flex; align-items: center; justify-content: center; opacity: .72; padding: 0; }
  #sideBack span { display: inline-block; animation: nudge 2.2s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { transform: translateX(-2px); opacity: .55; } 50% { transform: translateX(3px); opacity: 1; } }
  #sideMenu { position: absolute; left: 46px; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; padding-right: 9%;
    transition: opacity .3s ease; }
  .side-full #sideMenu { opacity: 0; pointer-events: none; }
  #sideMenu button { appearance: none; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--fx-rule); color: inherit;
    padding: max(14px, 1.7cqw) 0; font: 300 max(15px, 1.75cqw)/1.2 var(--f-jp); letter-spacing: .34em; }
  #sideMenu button:first-child { border-top: 1px solid var(--fx-rule); }
  #sideMenu button small { display: block; margin-top: .5em; font: 300 max(9px, .98cqw)/1 var(--f-data); letter-spacing: .32em; color: var(--fx-dim); }
  #sidePage { position: absolute; left: 46px; right: 0; top: 0; bottom: 0; opacity: 0; pointer-events: none; transition: opacity .3s ease; overflow: hidden auto; }

  /* 地形図は地が明るい：地名も濃い字にする（白い字は読めない） */
  .relief .lbl { color: #1d232b; text-shadow: 0 0 3px rgba(255, 255, 255, .95), 0 0 7px rgba(255, 255, 255, .8); }

  /* 降下の映像がまだ届いていないときの表示 */
  #wait { position: absolute; z-index: 1550; left: 50%; bottom: 17%; transform: translateX(-50%); pointer-events: none; opacity: 0; transition: opacity .3s ease;

  /* 下の文章へ／上の球へ */
  .pg .scr { position: absolute; right: 5cqw; appearance: none; border: 0; background: transparent; color: var(--fx-dim); padding: 8px 0 8px 12px; display: flex; align-items: center;

  /* ---- 第 14 版：文字はすべて一番細い太さに。地図の画面（地名・ボタン・題）も詳細ページと同じ書体・同じ冷たい白にそろえる ---- */
  :root { --ink: #eef2f5; --panel: rgba(11, 16, 22, .56); --line: rgba(238, 242, 245, .26); }
  html, body { font-family: "Jost", "Noto Sans JP Sub", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; }
  html *, html *::before, html *::after { font-weight: 200 !important; }

  #infoBtn, #back, #corpx, #moreBtn { border-radius: 4px; letter-spacing: .16em; }
  #title { background: transparent; border: 0; border-radius: 0; padding: 0; top: 16px; left: 16px; font-size: 12px; letter-spacing: .32em; color: var(--ink);
    text-shadow: 0 0 3px #000, 0 0 8px rgba(0, 0, 0, .9); }
  #vx { text-shadow: 0 0 3px #000, 0 0 8px rgba(0, 0, 0, .9); }
  #vx small { font-family: var(--f-data); }
  /* 地名：ここだけ一段太く（Jost 400）。下地は敷かず、字そのものの影だけを小さく柔らかく落とす。
     影は文字にだけ付く（下の波紋の点には付けない）。ボタン・題・詳細ページは一番細いまま */
  .lbl, .lbl * { font-weight: 400 !important; }
  .lbl { color: #f8fafc; font-size: 12.5px; letter-spacing: .14em; text-shadow: 0 0 2px rgba(0, 0, 0, .95), 0 0 4px rgba(0, 0, 0, .85), 0 1px 3px rgba(0, 0, 0, .7); }

  .lbl.zone { color: #fbdcd2; }
  .lbl .mk { width: 5px; height: 5px; margin-right: 7px; }
  .lbl.zone .mk { width: 6px; height: 6px; border-width: 1.5px; }
  /* 地形（白い模型）の図：明るい地なので暗い字（前からの色）に、白い小さなにじみ。題と左下の注記もここでは一段太く */

  .relief #title { color: #1f252d; text-shadow: 0 0 3px rgba(255, 255, 255, .9); }
  .relief #vx { text-shadow: 0 0 3px rgba(255, 255, 255, .9); }
  .relief #title, .relief #vx, .relief #vx * { font-weight: 400 !important; }
  /* 降下後の画面：地表を明るくしたぶん、紹介文の側の暗幕を少し濃く・広く。地図の上に載る注記は地名と同じく一段太く、影は小さく濃く */
  #scrim.right { background: linear-gradient(to right, rgba(8, 12, 18, 0) 36%, rgba(8, 12, 18, .7) 58%, rgba(8, 12, 18, .9) 100%); }
  #scrim.left { background: linear-gradient(to left, rgba(8, 12, 18, 0) 36%, rgba(8, 12, 18, .7) 58%, rgba(8, 12, 18, .9) 100%); }
  .note, .note * { font-weight: 400 !important; }
  .note .en, .note .jp { text-shadow: 0 0 2px rgba(0, 0, 0, .95), 0 0 4px rgba(0, 0, 0, .85), 0 1px 3px rgba(0, 0, 0, .7); }
  .note .jp { color: rgba(238, 242, 245, .9); font-size: 10px; }
  /* 地形版の降下終点：明るい白い模型の上なので、引き出し線の地名は暗い字と線に（地図の地名と同じ考え方） */

  /* 情報欄：収まらないときは高さを限って中を滑らせる。字の大きさは変えない */

  #intro.scroll { overflow: hidden; pointer-events: auto; touch-action: none; cursor: grab; overscroll-behavior: contain; }
  #intro.scroll.more { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 46px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 46px), transparent); }

  #intro .cap { font: 300 max(8px, 1.0cqw)/1 var(--f-data); letter-spacing: .24em; color: var(--fx-dim); margin-top: -.3cqw; }
  /* ---- 第 18 版：「戻る」一度目の案内（画面中央、2.6 秒） ---- */

    box-shadow: 0 0 18px rgba(var(--fx-glow), .12); opacity: 0; pointer-events: none; transition: opacity .35s ease, transform .35s ease; white-space: nowrap; }

  const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },

               del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

  // 鍵：QR コードの URL「#k=…」（サーバーには送られない）。読んだら端末に保存し、アドレスバーから消す
  let k = null;
  const m = location.hash.match(/k=([A-Za-z0-9_-]{43})/);
  if (m) { k = m[1]; ls.set('wv7k', k); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  else k = ls.get('wv7k');
  if (!k) { msg('QRコードから開いてください', 'Please open this page via the QR code'); return; }
  if (!window.crypto || !crypto.subtle) { msg('このブラウザには対応していません', 'This browser is not supported'); return; }
  const raw = Uint8Array.from(atob(k.replace(/-/g, '+').replace(/_/g, '/') + '='), (c) => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const dec = async (buf) => crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
  const getBin = async (u) => { const r = await fetch(u, { cache: 'no-cache' }); if (!r.ok) throw new Error(r.status); return dec(await r.arrayBuffer()); };
  try { await getBin('check.bin'); }
  catch (e) { ls.del('wv7k'); msg('QRコードが無効です。もう一度読み取ってください', 'This QR code is no longer valid. Please scan again'); return; }

  const meta = await fetch('meta.json', { cache: 'no-cache' }).then((r) => r.json());
  // 版の食い違い防止：このページの版番号と、サイトのデータ（meta.json）の版番号が違えば読み込み直す。
  // 古いページを開いたまま新しい画像を取りに行くと、地名と画像がずれ、境界の決まりも古いままになる
  const BUILD = 20;
  const fresh = (b) => {          // 同じ版番号では 1 回だけ（アドレスに ?b= が付いていれば、もう試した）
    const q = '?b=' + encodeURIComponent(b);
    if (location.search === q) return false;
    location.replace(location.pathname + q + '#k=' + k); return true;
  };
  if (meta.build && meta.build !== BUILD && fresh(meta.build)) return;
  const verCheck = () => {
    if (document.hidden) return;
    fetch('meta.json', { cache: 'no-cache' }).then((r) => r.json()).then((m2) => { if (m2.build && m2.build !== meta.build) fresh(m2.build); }).catch(() => {});
  };
  document.addEventListener('visibilitychange', verCheck);
  window.addEventListener('pageshow', (e) => { if (e.persisted) verCheck(); });
  setInterval(verCheck, 180000);
  let labels = null;
  try { labels = JSON.parse(new TextDecoder().decode(await getBin('labels.bin'))); } catch (e) {}
  const L0 = {}; for (const l of meta.layers) L0[l.id] = l;
  const Z = Math.max(...meta.layers.map((l) => l.maxZoom));
  // 第 20 版から：実際にタイルがある最も細かい段（nz）は maxZoom より小さい。maxZoom は座標の換算用にそのまま
  const NZ = (l) => (l.nz != null ? l.nz : l.maxZoom);
  const ZCAP = Math.max(...meta.layers.filter((l) => l.view !== 'fly').map(NZ)) + 1;          // 地図の拡大上限：いちばん細かいタイルを 2 倍まで
  const TILE_MIME = 'image/' + (meta.tileFmt || 'jpeg');

  const map = L.map('map', { crs: L.CRS.Simple, attributionControl: false, zoomControl: false,
    zoomSnap: 0.25, zoomDelta: 0.5, wheelPxPerZoomLevel: 90, bounceAtZoomLimits: false, maxBoundsViscosity: 0.96 });

  // 座標変換：地図単位 (X, Y) ⇔ 各ビューのピクセル
  const T = meta.top, O = meta.ob;
  const topL = meta.layers.find((l) => l.view === 'top') || { w: 9600, h: 5460 };
  const Zt = topL.maxZoom || Z;
  // 内側の地図（緩衝帯を除いた部分）の大きさと、大きい画像の中での位置
  const TW = T.w || topL.w, TH = T.h || topL.h, padT = topL.pad || [0, 0];
  const padO = (meta.layers.find((l) => l.view === 'ob') || {}).pad || [0, 0];
  const toPx = (view, X, Y, elev) => {

    return [(X * 0.01 - (O.cx_bu - O.W_BU / 2)) / O.W_BU * O.OW + padO[0], (O.sy_max - (Y * 0.01 * O.cos + zb * O.sin)) / O.H_BU * O.OH + padO[1]];
  };
  const fromPx = (view, px, py) => {
    if (view === 'top') return [T.X0 + (px - padT[0]) / TW * (T.X1 - T.X0), T.Y1 - (py - padT[1]) / TH * (T.Y1 - T.Y0)];

  };

  // 一度読んだタイル（復号済みの画像データ）は覚えておき、同じ場所へ戻ったときは通信せずに出す。多くなったら古い順に捨てる
  const tileMem = new Map(), TILE_MEM = 320;
  const getTile = (u) => {
    const hit = tileMem.get(u);

  function limit(l) {          // 最小ズーム＝lim が画面を覆う倍率。中心も lim の内側へ（アニメなし）

    hardLayer = null; map.setMaxBounds(null);

    const z = Math.max(map.getZoom(), zc);
    const snap = map.options.zoomSnap; map.options.zoomSnap = 0;      // 刻みで丸めない（丸めると「全体表示」が少し拡大されてしまう）

  });
  drg.on('predrag', () => {
    if (!hardOff || !hardLayer) return;

    o.x = Math.min(hardOff.max.x, Math.max(hardOff.min.x, o.x)); o.y = Math.min(hardOff.max.y, Math.max(hardOff.min.y, o.y));

    const z = map.getZoom(), c = map.getCenter(), e = 2 * Math.pow(2, hardLayer.maxZoom - z), hb = L.latLngBounds(map.unproject([e, hardLayer.h - e], hardLayer.maxZoom), map.unproject([hardLayer.w - e, e], hardLayer.maxZoom)), lc = map._limitCenter(c, z, hb);

  // 読み込み済みのタイルを捨てずに視野を切り替える（setView は倍率が変わると全部捨てて読み直す）
  const jump = (c, z) => { map._stop(); map._moveStart(true, false)._move(c, z)._moveEnd(true); };
  function tl(id) {
    if (!tileLayers[id]) { const l = L0[id];
      const t = tileLayers[id] = new EncLayer({ lid: id, tileSize: meta.tile, minZoom: -4, maxZoom: Z + 2, maxNativeZoom: NZ(l),
        minNativeZoom: 0, bounds: boundsOf(l), noWrap: true, keepBuffer: 3, updateWhenZooming: false, edge: 1, fade: 380 });
      // 下敷き：同じ図の粗いタイル（第 UZ 段）を拡大して敷いておく。細かいタイルが届くまで、空白や四角い欠けの代わりにこれが見える
      const uz = Math.min(3, NZ(l));
      const u = new EncLayer({ lid: id, tileSize: meta.tile, minZoom: -4, maxZoom: Z + 2, maxNativeZoom: uz, minNativeZoom: uz,
        bounds: boundsOf(l), noWrap: true, keepBuffer: 8, updateWhenZooming: false, edge: 1, fade: 1, zIndex: 0 });
      t.on('add', () => { if (!map.hasLayer(u)) u.addTo(map); });
      t.on('remove', () => { if (map.hasLayer(u)) map.removeLayer(u); });
    }
    return tileLayers[id];
  }

  const st = { map: ls.get('wv7m') || 'post', view: ls.get('wv7v') || 'top', style: 'color', labels: ls.get('wv7l') !== '0', fly: null };
  // 層は「地図-視点-スタイル」。その組み合わせの層が無ければ実景にする
  const lid = () => { const a = `${st.map}-${st.view}-${st.style}`; return L0[a] ? a : `${st.map}-${st.view}-color`; };
  const curLayer = () => L0[lid()] || meta.layers[0];
  let shown = null, labelGroup = null, curView = null;

  let holdLabels = false;          // 切替映像の間は地名を出さない
  const corpMk = {};          // 戦前の企業の点（開いた企業に印を付けるため）
  function drawLabels() {
    if (labelGroup) { map.removeLayer(labelGroup); labelGroup = null; }
    if (!labels || !st.labels || holdLabels) return;
    const ll = (X, Y, e) => map.unproject(toPx(st.view, X, Y, e), Zt);
    // タップできる地名：波紋の点が正確な位置、名前はその真上
    const pin = (cls, name) => `<span class="lbl pin ${cls}"><span class="nm">${name}</span><span class="rp"></span></span>`;
    if (st.map === 'pre') {          // 戦前：四大企業の本社
      if (!labels.pre) return;
      labelGroup = L.layerGroup();
      for (const p of labels.pre) {
        const at = ll(p.x, p.y, p.elev_m);
        const marker = L.marker(at, { icon: L.divIcon({ className: '', html: pin('corp fly', p.name), iconSize: null }), interactive: true, keyboard: false });
        marker.on('click', () => showCorp(p.key, at)); marker.addTo(labelGroup); corpMk[p.key] = marker;
      }
      labelGroup.addTo(map); declutter(); return;
    }
    labelGroup = L.layerGroup();
    for (const poly of labels.eden.polygons) {
      L.polygon(poly.map(([X, Y]) => ll(X, Y, 0)), { color: '#b6e6a0', weight: 1.6, opacity: .9, dashArray: '6 5',
        fillColor: '#9fe08a', fillOpacity: .07, interactive: false }).addTo(labelGroup);
    }
    for (const lb of labels.labels) {
      const fly = meta.flyins && meta.flyins[labels.flyto[lb.name]];
      const base = (lb.name === 'GARDEN OF EDEN' ? 'eden' : lb.kind) + (labels.flyto[lb.name] ? ' key' : '');
      const mk = lb.kind === 'area' || lb.name === 'GARDEN OF EDEN' ? '' : '<span class="mk"></span>';
      const html = fly ? pin(base + ' fly', lb.name) : `<span class="lbl ${base}">${mk}${lb.name}</span>`;
      const marker = L.marker(ll(lb.x, lb.y, lb.elev_m), { icon: L.divIcon({ className: '', html: html, iconSize: null }), interactive: !!fly, keyboard: false });
      if (fly) marker.on('click', () => window.dispatchEvent(new CustomEvent('wv7fly', { detail: labels.flyto[lb.name] })));
      marker.addTo(labelGroup);
    }
    labelGroup.addTo(map);
    declutter();
  }
  // 地名の重なり回避：優先度順に置き、重なるものは隠す（拡大すると現れる）
  const PRI = { eden: 0, corp: 0, key: 1, fly: 1, area: 2, zone: 3, site: 4, dot: 5 };
  function declutter() {
    if (!labelGroup) return;
    const els = [...document.querySelectorAll('.lbl')];
    const pri = (e) => Math.min(...[...e.classList].map((c) => PRI[c] ?? 9));
    els.sort((a, b) => pri(a) - pri(b));

    for (const e of els) {
      e.style.visibility = 'hidden';
      const r = e.getBoundingClientRect();
      const pad = 4;
      const hit = placed.some((p) => !(r.right + pad < p.left || r.left - pad > p.right || r.bottom + pad < p.top || r.top - pad > p.bottom));
      if (!hit) { e.style.visibility = ''; placed.push(r); }

  }

  function apply(first) {
    const id = lid(); const lay = L0[id];
    if (!lay) return;
    // ビュー切替時は同じ場所を中心に保つ
    let center = null, zoom = null;
    if (!first && curView && curView !== st.view) {
      const c = map.project(map.getCenter(), Zt); const [X, Y] = fromPx(curView, c.x, c.y);
      zoom = map.getZoom(); center = { X, Y };
    }

      const settle = () => { if (shown === next) dropOthers(next); };
      if (ready) settle(); else { next.once('load', settle); setTimeout(settle, 4000); }
    }
    if (first) {
      map.setMaxZoom(ZCAP);
      map.setView(limCenter(lay), coverZoom(lay), { animate: false });
    } else if (center) {
      hardLayer = null; map.setMaxBounds(null); map.setMinZoom(-4);

    limit(lay);
    curView = st.view;

      if (k2 === 'style') b.disabled = !L0[`${st.map}-${st.view}-${v}`];
      if (k2 === 'view') b.disabled = !L0[`${st.map}-${v}-color`];
    }
    document.getElementById('labseg').style.display = labels && (st.map === 'post' || labels.pre) ? '' : 'none';
    setTimeout(prewarm, 700);
    ls.set('wv7m', st.map); ls.set('wv7v', st.view); ls.set('wv7l', st.labels ? '1' : '0');
    drawLabels();
  }
  for (const b of document.querySelectorAll('.seg button')) {
    b.onclick = () => {
      if (st.fly || switching || flying) return;
      hideCorp();
      if (b.dataset.k === 'map') { if (b.dataset.v !== st.map) switchMap(b.dataset.v); return; }
      if (b.dataset.k === 'view') { if (b.dataset.v !== st.view) viewSwitch(b.dataset.v); return; }

  if (!L0[lid()]) { st.view = 'top'; st.style = 'color'; }

  const bh1 = document.createElement('span'), bh2 = document.createElement('small'); bh1.textContent = 'もう一度スワイプで閉じる'; bh2.textContent = 'SWIPE AGAIN TO LEAVE';
  backHint.append(bh1, bh2); stage.appendChild(backHint);
  let backGuard = !!(history.state && history.state.wv7g), hintOn = false, hintT = 0;          // 再読み込みのときは、もう足してあればそのまま
  const armBack = () => { if (backGuard || hintOn) return; try { history.pushState({ wv7g: 1 }, '', location.pathname + location.search); backGuard = true; } catch (e) {} };
  ['pointerup', 'touchend', 'click', 'keydown'].forEach((t) => document.addEventListener(t, armBack, true));
  window.addEventListener('popstate', (e) => {
    if (e.state && e.state.wv7g) { backGuard = true; return; }          // 「進む」で足した一つに戻った
    backGuard = false; hintOn = true; backHint.classList.add('on'); clearTimeout(hintT);
    hintT = setTimeout(() => { backHint.classList.remove('on'); hintOn = false; }, 2600);
  });
  window.__wv7back = { armed: () => backGuard, hint: () => hintOn };          // 動作確認用

  // ---- 詳細：右下のボタン → 右から出るメニュー（世界観／登場人物）→ 左へ広がって全画面。左端の矢印で一段戻る ----
  const sidePage = document.getElementById('sidePage'), moreBtn = document.getElementById('moreBtn');
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  // ---- 世界観の一枚目：星の全体。指で回せる球（拡大はしない）。手を離すとゆっくり自転する ----
  // 三次元のライブラリは使わない。画面いっぱいの三角形を一枚描き、点ごとに球面の緯度・経度を求めて、小さな図（赤 = 主大陸、緑 = 陸、青 = 氷）を引く。
  // 図は世界観を開いたときに初めて取りに行く。描けない端末では、同じ描き方の静止画を出す（描き方を変えるときは build_globe_v01.py も合わせる）
  function globeScreen(W) {
    const G = W.globe, E = G[st.map] || G.post, RAD = Math.PI / 180;
    const pg = el('div', 'pg gl'), left = el('div', 'glL'), right = el('div', 'glR'), cv = el('canvas'), hint = el('div', 'hint');
    hint.append(el('span', 'en', G.hint[0]), document.createTextNode(G.hint[1])); left.append(cv, hint);
    const top = el('div', 'top'); top.append(el('div', 'eyebrow', W.eyebrow), el('div', 'eyebrow', E.year));
    const big = el('div', 'big');
    for (const [k, pct] of [[G.sea, E.seaPct], [G.land, E.landPct]]) {
      const b = el('div'), cap = el('div', 'cap'), num = el('div', 'num', pct);
      cap.append(el('span', 'en', k[0]), document.createTextNode(k[1])); num.appendChild(el('i', '', '%')); b.append(cap, num); big.appendChild(b);
    }
    const say = el('div', 'say'); for (const t of E.lines) say.appendChild(el('p', '', t));
    const data = el('div', 'data'); for (const kv of E.data) { const d = el('span'); d.append(el('span', 'k', kv[0]), document.createTextNode(kv[1])); data.appendChild(d); }
    const foot = el('div', 'foot'); G.legend.forEach((lg, i) => { const s = el('span', 'lg' + i); s.append(el('i'), document.createTextNode(lg[0] + '  ' + lg[1])); foot.appendChild(s); });
    right.append(top, el('p', 'name', W.name), el('div', 'sub', W.sub), el('div', 'rule'), big, say, el('div', 'rule'), data, foot);
    [...right.children].forEach((e, i) => { e.style.animationDelay = (120 + i * 70) + 'ms'; });
    const scr = el('button', 'scr', G.scroll); scr.appendChild(el('i')); scr.onclick = () => sidePage.scrollTo({ top: sidePage.clientHeight, behavior: 'smooth' });
    pg.append(left, right, scr);

    let dead = false;
    const still = () => {          // 球を描けない端末：静止画
      if (dead) return; dead = true;
      loadImg(E.still).then((u) => { const im = el('img'); im.alt = ''; im.draggable = false; im.onload = () => im.classList.add('on'); im.src = u; cv.replaceWith(im); hint.style.display = 'none'; }).catch(() => {});
    };
    let gl = null;
    try { const o = { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'low-power' }; gl = cv.getContext('webgl', o) || cv.getContext('experimental-webgl', o); } catch (e) {}
    if (!gl) { still(); return pg; }
    const hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
    const FS = 'precision ' + (hp && hp.precision > 0 ? 'highp' : 'mediump') + ' float;\n' + `
uniform sampler2D uT; uniform vec2 uC; uniform vec4 uRot; uniform float uR, uTerm, uDpr;
const float PI = 3.14159265;
const vec3 BG = vec3(11., 16., 22.) / 255., INK = vec3(238., 242., 245.) / 255., GLOW = vec3(150., 205., 255.) / 255.;
float ln(float deg, float st, float w) { float d = abs(fract(deg / st + .5) - .5) * st; return 1. - smoothstep(w * .55, w * 1.45, d); }
void main() {
  vec2 p = (gl_FragCoord.xy - uC) / uR; float r2 = dot(p, p), d = sqrt(r2); vec3 col = BG;
  if (d > 1.) { float h = clamp(1. - (d - 1.) / .11, 0., 1.); col += (GLOW - BG) * h * h * .16; }
  else {
    float z = sqrt(1. - r2);
    col = (vec3(15., 24., 34.) + vec3(13., 19., 27.) * pow(z, 1.4)) / 255.;
    vec3 v = vec3(p.x, p.y * uRot.x + z * uRot.y, z * uRot.x - p.y * uRot.y);
    vec3 n = vec3(v.x * uRot.z + v.z * uRot.w, v.y, v.z * uRot.z - v.x * uRot.w);
    float lat = asin(clamp(n.y, -1., 1.)), lon = atan(n.x, n.z);
    float dlat = degrees(lat), dlon = degrees(lon - uTerm);
    float px = degrees(1. / uR) / max(z, .12), cl = max(cos(lat), .001), pole = 1. - step(80.5, abs(dlat));
    col = mix(col, INK, max(ln(dlat, 10., px * .55), ln(dlon, 10., px * .55 / cl) * pole) * .10);
    col = mix(col, INK, max(ln(dlat, 30., px * .6), ln(dlon, 30., px * .6 / cl) * pole) * .26);
    vec3 e = smoothstep(.34, .66, texture2D(uT, vec2(lon / (2. * PI) + .5, .5 - lat / PI)).rgb);
    col = mix(col, vec3(176., 196., 214.) / 255., clamp(e.g - e.r, 0., 1.) * .36);
    col = mix(col, vec3(214., 232., 250.) / 255., e.b * .60);
    col = mix(col, INK, e.r * .92);
    col = mix(col, GLOW, (1. - smoothstep(px * .6, px * 1.5, abs(dlat))) * .95);
    float q = max(2.2 * uDpr, uR / 75.), td = length(n - vec3(sin(uTerm), 0., cos(uTerm))) * uR;
    float mk = max(1. - smoothstep(q - uDpr, q + uDpr * .5, td), 1. - smoothstep(q * .3, q * .3 + uDpr, abs(td - q * 2.6)));
    col = mix(col, vec3(1.), mk * .96);
  }
  col = mix(col, INK, clamp(1. - abs(d - 1.) * uR / (.75 * uDpr), 0., 1.) * .8);
  gl_FragColor = vec4(col, 1.);
}`;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; };
    const vs = sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main() { gl_Position = vec4(a, 0., 1.); }'), fs = sh(gl.FRAGMENT_SHADER, FS), pr = gl.createProgram();
    if (!vs || !fs) { still(); return pg; }
    gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { still(); return pg; }
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = {}; for (const k of ['uT', 'uC', 'uRot', 'uR', 'uTerm', 'uDpr']) U[k] = gl.getUniformLocation(pr, k);
    gl.uniform1i(U.uT, 0); gl.uniform1f(U.uTerm, G.term * RAD);
    let ready = false, dirty = true;
    loadImg(E.tex, 'image/png').then((u) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = u; })).then((im) => {
      if (dead) return;
      gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false); gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, im);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      if (gl.getError() !== gl.NO_ERROR) throw new Error('tex');
      ready = true; dirty = true; cv.classList.add('on');
    }).catch(still);
    cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); still(); });

    // 向き：lon・lat はカメラの真下の経度・緯度。ドラッグで動かし、離すと惰性で少し回って、しばらくするとゆっくり自転に戻る
    const LIM = 86 * RAD, AUTO = -0.05, PADK = 1.14;          // PADK：キャンバスの一辺は球の直径の 1.14 倍（外側の淡い光のぶん）
    let lon = G.view[0] * RAD, lat = G.view[1] * RAD, vlon = 0, vlat = 0, drag = null, idle = 0, tPrev = 0, seen = false, odd = false, size = 0;
    const pt = (e) => (ROT ? [e.clientY, -e.clientX] : [e.clientX, e.clientY]);          // 縦持ちでは画面全体を 90° 回しているので、指の動きも回す
    cv.addEventListener('pointerdown', (e) => { const p = pt(e); drag = { id: e.pointerId, x: p[0], y: p[1], t: performance.now() }; vlon = vlat = 0; idle = 0;
      cv.classList.add('drag'); try { cv.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); });
    cv.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const p = pt(e), now = performance.now(), R = cv.clientWidth * .5 / PADK || 1, dt = Math.max(8, now - drag.t) / 1000;
      const dl = -(p[0] - drag.x) / R, db = (p[1] - drag.y) / R;
      lon += dl; lat = Math.max(-LIM, Math.min(LIM, lat + db)); vlon = .6 * vlon + .4 * dl / dt; vlat = .6 * vlat + .4 * db / dt;
      drag.x = p[0]; drag.y = p[1]; drag.t = now; dirty = true;
    });
    const up = (e) => { if (!drag || e.pointerId !== drag.id) return; if (performance.now() - drag.t > 110) vlon = vlat = 0; drag = null; idle = 0; cv.classList.remove('drag'); };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    const frame = (t) => {
      if (cv.isConnected) seen = true;
      else if (seen || dead) { dead = true; try { const x = gl.getExtension('WEBGL_lose_context'); if (x) x.loseContext(); } catch (e) {} return; }          // ページを閉じたら止めて、描画の資源を返す
      requestAnimationFrame(frame);
      const dt = Math.min(.05, (t - tPrev) / 1000 || 0); tPrev = t;
      if (dead || !ready || document.hidden) return;
      if (!drag) {
        idle += dt; const k = Math.exp(-dt / .45); vlon *= k; vlat *= k;
        const a = Math.min(1, Math.max(0, (idle - 1.6) / 1.5)), w = vlon + AUTO * a * a * (3 - 2 * a);
        if (Math.abs(w) > 1e-4 || Math.abs(vlat) > 1e-4) { lon += w * dt; lat = Math.max(-LIM, Math.min(LIM, lat + vlat * dt)); dirty = true; }
      }
      const dpr = Math.min(window.devicePixelRatio || 1, 3), s = Math.round(cv.clientWidth * dpr);
      if (s && s !== size) { size = s; cv.width = cv.height = s; gl.viewport(0, 0, s, s); dirty = true; }
      odd = !odd; if (!dirty || !size || (!drag && Math.abs(vlon) < .2 && odd)) return;          // ゆっくり回っているだけのときは 1 コマおきに描く
      dirty = false;
      gl.uniform2f(U.uC, size / 2, size / 2); gl.uniform1f(U.uR, size * .5 / PADK); gl.uniform1f(U.uDpr, dpr);
      gl.uniform4f(U.uRot, Math.cos(lat), Math.sin(lat), Math.cos(lon), Math.sin(lon));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
    requestAnimationFrame(frame);
    return pg;
  }
  function pageWorld() {
    const W = labels.world; if (!W) return;
    const first = W.globe ? globeScreen(W) : null;
    const pg = el('div', first ? 'pg two' : 'pg');
    if (first) { sidePage.appendChild(first); const up = el('button', 'scr up', 'GLOBE'); up.appendChild(el('i')); up.onclick = () => sidePage.scrollTo({ top: 0, behavior: 'smooth' }); pg.appendChild(up); }
    else pg.append(el('div', 'eyebrow', W.eyebrow), el('p', 'name', W.name), el('div', 'sub', W.sub), el('div', 'rule'));
    const cols = el('div', 'cols');
    W.sections.forEach((s, i) => { const sec = el('div', 'sec'); sec.style.animationDelay = (260 + i * 140) + 'ms';
      sec.append(el('h3', '', s.h), el('h4', '', s.jp)); for (const t of s.lines) sec.appendChild(el('p', '', t)); cols.appendChild(sec); });
    const data = el('div', 'data');
    for (const kv of W.data) { const d = el('span'); d.append(el('span', 'k', kv[0]), document.createTextNode(kv[1])); data.appendChild(d); }
    pg.append(cols, el('div', 'rule'), data);
    [...pg.children].forEach((e, i) => { if (!e.style.animationDelay) e.style.animationDelay = (i < 4 ? i * 70 : 700 + i * 40) + 'ms'; });
    sidePage.appendChild(pg);
  }
  // ABOUT：一枚目は作者と作品（所属、連絡先）。二枚目（下へ滑らせる）は権利と使った素材――字を小さく淡く、いちばん下に著作権の一行
  function pageAbout() {
    const A = labels.about; if (!A) return;
    const sec = (q, i) => { const e = el('div', 'sec'); e.style.animationDelay = (260 + i * 140) + 'ms'; e.append(el('h3', '', q.h), el('h4', '', q.jp)); for (const t of q.lines) e.appendChild(el('p', '', t)); return e; };
    const p1 = el('div', 'pg ab1');
    p1.append(el('div', 'eyebrow', A.eyebrow), el('p', 'name', A.name), el('div', 'sub', A.sub), el('div', 'rule'));
    const c1 = el('div', 'cols'); (A.sections || []).forEach((q, i) => c1.appendChild(sec(q, i))); p1.appendChild(c1);
    [...p1.children].forEach((e, i) => { if (!e.style.animationDelay) e.style.animationDelay = (i * 70) + 'ms'; });
    const dn = el('button', 'scr', A.scroll || 'SCROLL'); dn.appendChild(el('i')); dn.onclick = () => sidePage.scrollTo({ top: p1.offsetHeight, behavior: 'smooth' }); p1.appendChild(dn);
    const p2 = el('div', 'pg two ab2');
    const up = el('button', 'scr up', A.up || 'ABOUT'); up.appendChild(el('i')); up.onclick = () => sidePage.scrollTo({ top: 0, behavior: 'smooth' });
    const c2 = el('div', 'cols'); (A.notice || []).forEach((q, i) => c2.appendChild(sec(q, i)));
    p2.append(up, c2, el('div', 'copy', A.copyright || ''));
    sidePage.append(p1, p2);
  }
  function pageChars() {
    const C = labels.chars || []; if (!C.length) return;
    const wrap = el('div', 'chr'), pic = el('div', 'pic'), txt = el('div', 'txt'), strip = el('div', 'strip'), img = el('img');
    img.alt = ''; img.draggable = false; pic.appendChild(img); wrap.append(pic, txt, strip); sidePage.appendChild(wrap);
    let cur = -1, tok = 0;
    const show = (i) => {
      if (i === cur) return; cur = i; const c = C[i], my = ++tok, n2 = (n) => String(n).padStart(2, '0');
      [...strip.children].forEach((b, j) => b.classList.toggle('on', j === i));
      txt.textContent = '';
      const body = el('div', 'body'); for (const t of c.body) body.appendChild(el('p', '', t));
      txt.append(el('div', 'eyebrow', 'CHARACTER ' + n2(i + 1) + ' / ' + n2(C.length)), el('p', 'name', c.name), el('div', 'sub', c.jp), el('div', 'role', c.role), el('div', 'rule'), body);
      [...txt.children].forEach((e, k) => { e.style.animationDelay = (k * 70) + 'ms'; });
      img.classList.remove('on');
      Promise.all([loadImg(c.img), sleep(img.getAttribute('src') ? 230 : 0)]).then(([u]) => { if (my !== tok) return;
        img.style.objectPosition = (c.hx != null ? c.hx : 50) + '% 0';          // 枠いっぱいに切り抜く。頭が横の中央に来るように
        img.onload = () => { if (my === tok) img.classList.add('on'); }; img.src = u; }).catch(() => {});
    };
    C.forEach((c, i) => { const b = el('button', 'th'), t = el('img'); b.setAttribute('aria-label', c.name); t.alt = ''; t.draggable = false; t.src = c.thumb || ''; b.appendChild(t);
      b.onclick = () => show(i); strip.appendChild(b); });
    show(0);
    for (const c of C.slice(1)) loadImg(c.img).catch(() => {});          // 残りの絵も先に読んでおく
  }
  function closeSide() { root.classList.remove('side-open', 'side-full'); setTimeout(() => { if (!root.classList.contains('side-full')) sidePage.textContent = ''; }, 600); }
  if (labels && (labels.world || labels.chars)) {
    moreBtn.onclick = () => { if (switching || flying || st.fly) return; hideCorp(); root.classList.add('side-open'); };
    document.getElementById('sideShade').onclick = closeSide;
    document.getElementById('sideBack').onclick = () => {
      if (root.classList.contains('side-full')) { root.classList.remove('side-full'); setTimeout(() => { if (!root.classList.contains('side-full')) sidePage.textContent = ''; }, 600); }
      else closeSide();
    };
    const abBtn = document.querySelector('#sideMenu button[data-p="about"]');          // ABOUT の小さい字は暗号化した文字データから入れる。データがなければ項目ごと消す
    if (abBtn) { if (labels.about) abBtn.querySelector('small').textContent = labels.about.menu || ''; else abBtn.remove(); }
    for (const b of document.querySelectorAll('#sideMenu button')) b.onclick = () => {
      sidePage.textContent = ''; sidePage.scrollTop = 0; ({ world: pageWorld, chars: pageChars, about: pageAbout })[b.dataset.p](); root.classList.add('side-full');
    };
  } else moreBtn.style.display = 'none';
  window.addEventListener('wv7fly', (e) => fly(e.detail));
  backBtn.onclick = flyBack;
  // 降下の映像は、いま見ている図の種類（実景／地形）に合うほうだけ先に取る。地形図に切り替えたら地形版も取る
  const preFly = () => { if (meta.flyins) for (const key of Object.keys(meta.flyins)) loadFly(key, flyV(key).video).catch(() => {}); };
  if (meta.flyins) setTimeout(preFly, 2500);
  for (const b of document.querySelectorAll('.seg button')) if (b.dataset.k === 'style') b.addEventListener('click', () => setTimeout(preFly, 1500));
})().catch((e) => {
  document.getElementById('msgtext').innerHTML = '読み込みに失敗しました。通信を確認して再読み込みしてください<br><small>Failed to load. Check your connection and reload.</small>';
  document.getElementById('msg').classList.add('show');
});
