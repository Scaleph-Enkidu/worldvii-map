<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e141c">
<meta name="color-scheme" content="only light">
<title>世界Ⅶ / WORLD VII</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=689e8fa6">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=7c453871">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=fba1f5df">
<link rel="stylesheet" href="lib/leaflet.css?v=ec929f11">
<style>
  :root { --ink: #ece7dc; --panel: rgba(12, 17, 24, .80); --line: rgba(236, 231, 220, .22); }
  html, body { margin: 0; height: 100%; background: #0e141c; color: var(--ink); overflow: hidden;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif; }
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; transform-origin: 0 0; }
  #map { position: absolute; inset: 0; background: #0e141c; }
  .leaflet-container { background: transparent; font-family: inherit; }
  .leaflet-tile:not([src]) { visibility: hidden !important; }          /* 画像の無いタイルは見せない（白い枠が出る） */
  .leaflet-tile, #map img { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 3px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: calc((13px) * var(--fs));
    font-weight: 600; padding: 7px 12px; border-radius: 17px; line-height: 1.1; white-space: nowrap; }
  .seg button small { display: block; font-size: calc((9px) * var(--fs)); font-weight: 500; letter-spacing: .12em; opacity: .75; }
  .seg button.on { background: var(--ink); color: #0e141c; }
  .seg button:disabled { opacity: .3; }
  #top { position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%); top: 10px; }
  #bottom { position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%); bottom: 12px;
    display: flex; gap: 6px; }
  #title { position: absolute; z-index: 1000; left: 14px; top: 12px;
    font-size: calc((11px) * var(--fs)); letter-spacing: .18em; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 4px 10px; color: rgba(236, 231, 220, .85); }
  #msg { position: absolute; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-size: calc((16px) * var(--fs)); line-height: 1.8; background: #0e141c; }
  #msg.show { display: flex; }
  .lbl { color: #f3eee4; text-shadow: 0 0 3px #000, 0 0 6px #000, 0 1px 2px #000; white-space: nowrap; font-weight: 600;
    letter-spacing: .06em; transform: translate(-50%, -50%); display: inline-block; pointer-events: none; }
  .lbl.area { font-size: calc((12px) * var(--fs)); letter-spacing: .28em; font-style: italic; opacity: .92; }
  .lbl.dot, .lbl.site, .lbl.zone { font-size: calc((11px) * var(--fs)); }
  .lbl .mk { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #f3eee4; margin-right: 5px;
    vertical-align: middle; box-shadow: 0 0 3px #000; }
  .lbl.site .mk { border-radius: 1px; transform: rotate(45deg); background: #e8c070; }
  .lbl.zone .mk { background: transparent; border: 2px solid #e0705a; width: 6px; height: 6px; }
  .lbl.zone { color: #f6d2c8; }
  .lbl.eden { font-size: calc((13px) * var(--fs)); color: #d9f2c8; letter-spacing: .2em; }
  .lbl.fly { pointer-events: auto; cursor: pointer; }
  .leaflet-div-icon { background: transparent; border: 0; }
  /* 細い書体（ページに同梱。外部のフォント配信には頼らない） */
  @font-face { font-family: "Jost"; src: url("lib/fonts/jost-400.woff2?v=a61b232f") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Jost"; src: url("lib/fonts/jost-200.woff2?v=2bdfa208") format("woff2"); font-weight: 200; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("lib/fonts/ibm-plex-mono-300.woff2?v=7b9722e5") format("woff2"); font-weight: 300; font-display: swap; }
  @font-face { font-family: "Noto Sans JP Sub"; src: url("lib/fonts/noto-sans-jp-400-notes.woff2?v=035f7e35") format("woff2"); font-weight: 400; font-display: swap; unicode-range: U+304C, U+305F, U+3063, U+306E, U+30B3, U+30C6, U+30CA, U+30F3, U+4E0A, U+4E8C, U+5168, U+56FD, U+57CE, U+589F, U+5C04, U+5E02, U+5E55, U+5E72, U+5E95, U+5EC3, U+6559, U+6761, U+6D77, U+6E9D, U+7167, U+72B6, U+76F4, U+7DDA, U+8239, U+90FD, U+9244, U+9577; }
  @font-face { font-family: "Noto Sans JP Sub"; src: url("lib/fonts/noto-sans-jp-200-subset.woff2?v=329475f9") format("woff2"); font-weight: 200; font-display: swap; }
  :root { --fx-ink: #eef2f5; --fx-dim: rgba(238, 242, 245, .52); --fx-glow: 150, 205, 255; --fx-rule: rgba(238, 242, 245, .24);
    --fx-shade: 0 0 .6em rgba(4, 8, 12, .8);
    --f-label: "Jost", "Futura", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
    --f-data: "IBM Plex Mono", "SFMono-Regular", Consolas, "Courier New", monospace;
    --f-jp: "Noto Sans JP Sub", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; }
  #stage { container-type: size; }

  /* タップできる地名：丸い印から波紋が広がり続ける */
  .lbl .rp { display: inline-block; position: relative; width: 7px; height: 7px; margin-right: 8px; vertical-align: middle; border-radius: 50%;
    background: #fff; box-shadow: 0 0 6px rgba(var(--fx-glow), .95), 0 0 2px #fff; }
  .lbl .rp::before, .lbl .rp::after { content: ""; position: absolute; inset: -1px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .95);
    animation: rip 2.4s cubic-bezier(.2, .6, .3, 1) infinite; }
  .lbl .rp::after { animation-delay: 1.2s; }
  @keyframes rip { from { transform: scale(1); opacity: .95; } to { transform: scale(4.6); opacity: 0; } }

  /* 降下後の情報表示：片側の暗幕、紹介文、引き出し線つきの地名 */
  /* 暗幕：側（左右）の背景を付けてから .on で淡く現れる（背景が無いうちに透明度だけ先に上げない） */
  #scrim { position: absolute; inset: 0; z-index: 610; pointer-events: none; opacity: 0; }
  #scrim.right { background: linear-gradient(to right, rgba(8, 12, 18, 0) 44%, rgba(8, 12, 18, .62) 65%, rgba(8, 12, 18, .86) 100%); }
  #scrim.left { background: linear-gradient(to left, rgba(8, 12, 18, 0) 44%, rgba(8, 12, 18, .62) 65%, rgba(8, 12, 18, .86) 100%); }
  #scrim.on { opacity: 1; transition: opacity .9s ease; }
  #intro { position: absolute; z-index: 620; top: 9%; width: 42%; display: flex; flex-direction: column; gap: 1.1cqw; pointer-events: none;
    color: var(--fx-ink); text-shadow: var(--fx-shade); transition: opacity .35s ease; }
  #intro.right { right: 2.8%; }
  /* 左側のときは、左上の「戻る」「情報」ボタンの下から始める */
  #intro.left { left: 2.8%; top: max(9%, 64px); }
  #intro .eyebrow { font: 300 calc((max(8.5px, 1.12cqw)) * var(--fs))/1 var(--f-data); letter-spacing: .26em; color: var(--fx-dim); }
  #intro .name { font: 200 calc((max(20px, 3cqw)) * var(--fs))/1 var(--f-label); letter-spacing: .24em; margin: 0; }
  #intro .sub { font: 300 calc((max(9.5px, 1.3cqw)) * var(--fs))/1.4 var(--f-jp); letter-spacing: .34em; color: var(--fx-dim); }
  #intro .rule { height: 1px; transform-origin: left center; transform: scaleX(0); box-shadow: 0 0 .5cqw rgba(var(--fx-glow), .35);
    background: linear-gradient(to right, rgba(238, 242, 245, .7), var(--fx-rule) 30%, var(--fx-rule)); }
  #intro .body { display: flex; flex-direction: column; gap: .5cqw; font: 300 calc((max(10px, 1.32cqw)) * var(--fs))/1.85 var(--f-jp); letter-spacing: .08em; }
  #intro .data { display: flex; flex-direction: column; gap: .3cqw; font: 300 calc((max(9px, 1.15cqw)) * var(--fs))/1.7 var(--f-data); letter-spacing: .08em; }
  #intro .data .k { color: var(--fx-dim); }
  .note { position: absolute; left: 0; top: 0; width: 0; height: 0; color: var(--fx-ink); text-shadow: var(--fx-shade); pointer-events: none; transition: opacity .35s ease; }
  .note svg { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; filter: drop-shadow(0 0 3px rgba(var(--fx-glow), .6)); }
  .note polyline { fill: none; stroke: #fff; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .note .dot { position: absolute; left: -3.5px; top: -3.5px; width: 7px; height: 7px; box-sizing: border-box; border: 1px solid #fff; border-radius: 50%;
    box-shadow: 0 0 6px rgba(var(--fx-glow), .9); transform: scale(0); }
  .note .nt { position: absolute; white-space: nowrap; }
  .note .en { font: 300 calc((11px) * var(--fs))/1 var(--f-label); letter-spacing: .22em; position: absolute; left: 0; bottom: 6px; }
  .note .jp { font: 300 calc((9.5px) * var(--fs))/1 var(--f-jp); letter-spacing: .1em; color: var(--fx-dim); position: absolute; left: 0; top: 6px; }
  .noinfo #intro, .noinfo .note { opacity: 0; }
  .noinfo #scrim.on { opacity: 0; transition: opacity .35s ease; }
  /* 戻るとき：暗幕・紹介文・地名を先に淡く消す（「戻る」「情報」は .flyend を外すと淡く消える） */
  .leaving #scrim.on { opacity: 0; transition: opacity .4s ease; }
  .leaving #intro, .leaving .note { opacity: 0; }
  /* 文字が湧き出す効果：1 文字 1 マス。マス幅は最終の文字幅（em）で固定するので、乱数文字が跳ねても行は揺れない */
  .sx { display: block; white-space: pre; }
  .sx .c { display: inline-block; text-align: center; overflow: hidden; vertical-align: bottom; }
  .sx .c.wait { visibility: hidden; }
  .sx .c.hot { color: #fff; text-shadow: 0 0 .16em rgba(255, 255, 255, .95), 0 0 .65em rgba(var(--fx-glow), .8), 0 0 1.7em rgba(var(--fx-glow), .42); }
  .sx .c.lock { animation: fxlock .5s ease-out both; }
  @keyframes fxlock {
    from { color: #fff; text-shadow: 0 0 .16em rgba(255, 255, 255, .9), 0 0 .8em rgba(var(--fx-glow), .7), 0 0 1.9em rgba(var(--fx-glow), .35); }
    to { text-shadow: var(--fx-shade); }
  }
  #infoBtn { position: absolute; z-index: 1600; left: 100px; top: 12px; appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit; font-size: calc((13px) * var(--fs)); font-weight: 600; padding: 8px 14px; border-radius: 18px;
    line-height: 1.1; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #infoBtn small { display: block; font-size: calc((9px) * var(--fs)); font-weight: 500; letter-spacing: .12em; opacity: .75; }
  /* 「戻る」「情報」：ぱっと出さず、淡く現れて少し下りてくる。隠れている間は押せない */
  #back, #infoBtn { display: block; opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-8px);
    transition: opacity .45s ease, transform .45s ease, visibility 0s linear .45s; }
  .flyend #back, .flyend #infoBtn { opacity: 1; visibility: visible; pointer-events: auto; transform: none;
    transition: opacity .6s ease .15s, transform .6s cubic-bezier(.2, .7, .2, 1) .15s, visibility 0s; }
  .flyend #infoBtn { transition-delay: .27s, .27s, 0s; }
  .flyend.noinfo #infoBtn { opacity: .55; }

  #flyv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none;
    transition: opacity .4s ease; z-index: 1500; }
  #flyv.show { opacity: 1; }
  #top, #bottom, #title { transition: opacity .3s ease; }
  .flying #top, .flying #bottom, .flying #title { opacity: 0; pointer-events: none; }
  #back { position: absolute; z-index: 1600; left: 14px; top: 12px; appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit; font-size: calc((13px) * var(--fs)); font-weight: 600; padding: 8px 14px; border-radius: 18px;
    line-height: 1.1; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #back small { display: block; font-size: calc((9px) * var(--fs)); font-weight: 500; letter-spacing: .12em; opacity: .75; }
  /* 高さを 8 倍に強調していることの注記（左下）。降下中は消し、エデンの終点では出す。沿岸の廃墟は実寸なので出さない */
  #vx { position: absolute; z-index: 1000; left: 14px; bottom: 14px; pointer-events: none; font-size: calc((10px) * var(--fs)); letter-spacing: .14em; line-height: 1.5;
    color: rgba(236, 231, 220, .82); text-shadow: 0 0 3px #000, 0 0 6px #000; transition: opacity .3s ease; }
  #vx small { display: block; font-size: calc((8.5px) * var(--fs)); letter-spacing: .2em; opacity: .8; }
  .flying #vx { opacity: 0; }
  .flyend.fly-eden #vx { opacity: 1; }
  /* 戦前⇔戦後の切替映像（地図に重ねる）：淡く現れて淡く消える */
  .seafx { opacity: 0; transition: opacity .3s ease; pointer-events: none; }
  .seafx.show { opacity: 1; }
  /* 年の表示（右上）：SA の PV の年カウンターと同じ作り（細い数字、速く変わる桁は縦に流れる、確定で一度光る、下に YEAR） */
  #yr { position: absolute; z-index: 1000; right: 18px; top: 12px; pointer-events: none; opacity: 0; transition: opacity .35s ease; text-align: center;
    color: var(--fx-ink); text-shadow: 0 0 4px rgba(4, 8, 12, .9), 0 0 12px rgba(4, 8, 12, .7); }
  #yr.show { opacity: 1; }
  #yr .n { font: 200 calc((max(30px, 4.6cqw)) * var(--fs))/1 var(--f-label); letter-spacing: .02em; white-space: nowrap; }
  #yr .d { display: inline-block; width: .6em; text-align: center; }
  #yr .d.b1 { opacity: .8; text-shadow: 0 -.10em .06em rgba(238, 242, 245, .45), 0 .10em .06em rgba(238, 242, 245, .45); }
  #yr .d.b2 { opacity: .55; text-shadow: 0 -.20em .10em rgba(238, 242, 245, .5), 0 .20em .10em rgba(238, 242, 245, .5), 0 -.36em .16em rgba(238, 242, 245, .25), 0 .36em .16em rgba(238, 242, 245, .25); }
  #yr .r { height: 1px; margin: .5cqw auto 0; width: 62%; background: var(--fx-rule); }
  #yr .c { font: 300 calc((max(8px, .95cqw)) * var(--fs))/1 var(--f-data); letter-spacing: .5em; margin: .5cqw 0 0 .5em; color: var(--fx-dim); }
  #yr.lock .n { animation: yrlock .9s ease-out both; }
  @keyframes yrlock { from { color: #fff; text-shadow: 0 0 .12em rgba(255, 255, 255, .95), 0 0 .5em rgba(var(--fx-glow), .85), 0 0 1.4em rgba(var(--fx-glow), .45); }
    to { text-shadow: 0 0 4px rgba(4, 8, 12, .9), 0 0 12px rgba(4, 8, 12, .7); } }
  .flying #yr { opacity: 0; }
  /* 地形図は地が明るいので、注記と年は濃い字にする */
  .relief #vx { color: #1f252d; text-shadow: none; font-weight: 500; }
  .relief #yr { color: #232a33; text-shadow: 0 0 6px rgba(255, 255, 255, .5); }
  .relief #yr .d.b1 { text-shadow: 0 -.10em .06em rgba(35, 42, 51, .4), 0 .10em .06em rgba(35, 42, 51, .4); }
  .relief #yr .d.b2 { text-shadow: 0 -.20em .10em rgba(35, 42, 51, .45), 0 .20em .10em rgba(35, 42, 51, .45), 0 -.36em .16em rgba(35, 42, 51, .22), 0 .36em .16em rgba(35, 42, 51, .22); }
  .relief #yr .r { background: rgba(35, 42, 51, .3); }
  .relief #yr .c { color: rgba(35, 42, 51, .6); }
  .relief #yr.lock .n { animation: yrlockd .9s ease-out both; }
  @keyframes yrlockd { from { color: #000; text-shadow: 0 0 .5em rgba(255, 255, 255, .95), 0 0 1.4em rgba(255, 255, 255, .7); } to { text-shadow: 0 0 6px rgba(255, 255, 255, .5); } }
  /* ===== 第 11 版 ===== */
  /* タップできる地名：波紋の点は地図上の正確な位置に置き、名前はその真上に中央揃えで出す */
  .lbl.pin { display: inline-flex; flex-direction: column; align-items: center; transform: translate(-50%, calc(-100% + 3.5px)); }
  .lbl.pin .rp { margin: 6px 0 0; }
  .lbl.corp { font-size: calc((12px) * var(--fs)); letter-spacing: .22em; }
  /* 俯瞰⇔45° の切替映像：画面の中央に置き、再生に合わせて大きさを変える */
  #tiltv { position: absolute; left: 50%; top: 50%; z-index: 800; transform: translate(-50%, -50%); opacity: 0; pointer-events: none;
    transition: opacity .16s ease; max-width: none; }
  #tiltv.show { opacity: 1; }
  /* 切替の途中は操作を受け付けない */
  .busy #top, .busy #bottom, .busy #moreBtn { pointer-events: none; }
  /* 戦前の四大企業：本社をタップしたときの紹介（降下後の紹介欄と同じ作り） */
  #intro.corp { gap: 1cqw; }
  #intro.corp .logo { height: max(46px, 8.5cqw); max-width: 70%; object-fit: contain; object-position: left center; align-self: flex-start;
    opacity: 0; transition: opacity .6s ease; filter: drop-shadow(0 0 .6em rgba(4, 8, 12, .7)); margin-bottom: .6cqw; }
  #intro.corp .logo.on { opacity: 1; }
  #intro.corp .name { letter-spacing: .3em; }
  #corpx { position: absolute; z-index: 1600; left: 14px; top: 12px; appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit; font-size: calc((13px) * var(--fs)); font-weight: 600; padding: 8px 14px; border-radius: 18px;
    line-height: 1.1; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-8px); transition: opacity .4s ease, transform .4s ease, visibility 0s linear .4s; }
  #corpx small { display: block; font-size: calc((9px) * var(--fs)); font-weight: 500; letter-spacing: .12em; opacity: .75; }
  .corp-open #corpx { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition: opacity .5s ease .1s, transform .5s cubic-bezier(.2, .7, .2, 1) .1s, visibility 0s; }
  .corp-open #title { opacity: 0; }
  /* 詳細：右下のボタン → 右から出るメニュー → 全画面のページ */
  #moreBtn { position: absolute; z-index: 1000; right: 14px; bottom: 12px; appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit; font-size: calc((13px) * var(--fs)); font-weight: 600; padding: 7px 12px 7px 15px; border-radius: 20px;
    line-height: 1.1; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; gap: 9px; text-align: left;
    transition: opacity .3s ease; }
  #moreBtn small { display: block; font-size: calc((9px) * var(--fs)); font-weight: 500; letter-spacing: .12em; opacity: .75; }
  #moreBtn i { font: 200 calc((22px) * var(--fs))/1 var(--f-label); font-style: normal; transform: translateY(-1px); }
  .flying #moreBtn, .side-open #moreBtn, .corp-open #moreBtn { opacity: 0; pointer-events: none; }
  #sideShade { position: absolute; inset: 0; z-index: 1690; background: rgba(4, 8, 12, .42); opacity: 0; pointer-events: none; transition: opacity .4s ease; }
  .side-open #sideShade { opacity: 1; pointer-events: auto; }
  #side { position: absolute; z-index: 1700; top: 0; right: 0; height: 100%; width: max(30%, 236px); box-sizing: border-box; overflow: hidden;
    transform: translateX(103%); color: var(--fx-ink); background: rgba(11, 16, 22, .9); border-left: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform .45s cubic-bezier(.2, .7, .2, 1), width .55s cubic-bezier(.3, .7, .2, 1), background-color .4s ease, border-color .4s ease; }
  .side-open #side { transform: none; }
  .side-full #side { width: 100%; background: rgb(11, 16, 22); border-left-color: transparent; }
  /* 左端の右向き矢印：全画面のときはメニューへ戻り、メニューのときは閉じる */
  #sideBack { position: absolute; z-index: 3; left: 0; top: 0; bottom: 0; width: 46px; appearance: none; border: 0; background: transparent; color: var(--fx-ink);
    font: 200 calc((30px) * var(--fs))/1 var(--f-label); display: flex; align-items: center; justify-content: center; opacity: .72; padding: 0; }
  #sideBack span { display: inline-block; animation: nudge 2.2s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { transform: translateX(-2px); opacity: .55; } 50% { transform: translateX(3px); opacity: 1; } }
  #sideMenu { position: absolute; left: 46px; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; padding-right: 9%;
    transition: opacity .3s ease; }
  .side-full #sideMenu { opacity: 0; pointer-events: none; }
  #sideMenu button { appearance: none; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--fx-rule); color: inherit;
    padding: max(14px, 1.7cqw) 0; font: 300 calc((max(15px, 1.75cqw)) * var(--fs))/1.2 var(--f-jp); letter-spacing: .34em; }
  #sideMenu button:first-child { border-top: 1px solid var(--fx-rule); }
  #sideMenu button small { display: block; margin-top: .5em; font: 300 calc((max(9px, .98cqw)) * var(--fs))/1 var(--f-data); letter-spacing: .32em; color: var(--fx-dim); }
  #sidePage { position: absolute; left: 46px; right: 0; top: 0; bottom: 0; opacity: 0; pointer-events: none; transition: opacity .3s ease; overflow: hidden auto; }
  .side-full #sidePage { opacity: 1; pointer-events: auto; transition: opacity .45s ease .3s; }
  @keyframes pgin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .pg { min-height: 100%; box-sizing: border-box; padding: max(18px, 5.2cqh) 5cqw max(14px, 4cqh) 2.4cqw; display: flex; flex-direction: column; gap: max(6px, 1.5cqh); }
  .pg > * { animation: pgin .6s ease both; }
  .pg .eyebrow, .chr .eyebrow { font: 300 calc((max(8.5px, 1.05cqw)) * var(--fs))/1 var(--f-data); letter-spacing: .3em; color: var(--fx-dim); }
  .pg .name, .chr .name { font: 200 calc((max(22px, 3.3cqw)) * var(--fs))/1 var(--f-label); letter-spacing: .26em; margin: 0; }
  .pg .sub, .chr .sub { font: 300 calc((max(10px, 1.3cqw)) * var(--fs))/1.3 var(--f-jp); letter-spacing: .4em; color: var(--fx-dim); }
  .pg .rule, .chr .rule { height: 1px; flex: none; background: linear-gradient(to right, rgba(238, 242, 245, .7), var(--fx-rule) 30%, var(--fx-rule)); }
  .pg .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3.2cqw; flex: 1; align-content: start; margin-top: max(4px, 1.2cqh); }
  .pg .sec { animation: pgin .7s ease both; }
  .pg .sec h3 { font: 300 calc((max(8.5px, 1.02cqw)) * var(--fs))/1 var(--f-data); letter-spacing: .28em; margin: 0 0 .7cqw; color: var(--fx-dim); }
  .pg .sec h4 { font: 300 calc((max(13px, 1.7cqw)) * var(--fs))/1.2 var(--f-jp); letter-spacing: .34em; margin: 0 0 1.1cqw; }
  .pg .sec p { font: 300 calc((max(10.5px, 1.24cqw)) * var(--fs))/1.9 var(--f-jp); letter-spacing: .06em; margin: 0 0 .55cqw; }
  .pg .data { display: flex; flex-wrap: wrap; gap: .5cqw 3.2cqw; font: 300 calc((max(9px, 1.08cqw)) * var(--fs))/1.6 var(--f-data); letter-spacing: .1em; }
  .pg .data .k { color: var(--fx-dim); margin-right: 1.2em; }
  /* 登場人物：左に半身像、右に名前と紹介、下に切替 */
  .chr { position: absolute; inset: 0; display: flex; }
  .chr .pic { flex: 0 0 41%; position: relative; height: 100%; }
  .chr .pic img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; opacity: 0; transition: opacity .35s ease;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%); mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%); }
  .chr .pic img.on { opacity: 1; }
  .chr .txt { flex: 1; min-width: 0; padding: max(20px, 9cqh) 5cqw 0 2cqw; display: flex; flex-direction: column; gap: max(6px, 1.6cqh); }
  .chr .txt > * { animation: pgin .55s ease both; }
  .chr .role { font: 300 calc((max(10px, 1.2cqw)) * var(--fs))/1.3 var(--f-jp); letter-spacing: .3em; }
  .chr .body p { font: 300 calc((max(10.5px, 1.28cqw)) * var(--fs))/1.9 var(--f-jp); letter-spacing: .06em; margin: 0 0 .5cqw; }
  .chr .strip { position: absolute; left: 43%; right: 4cqw; bottom: max(12px, 4.5cqh); display: flex; gap: max(6px, .9cqw); }
  .chr .th { appearance: none; flex: none; width: max(38px, 5.6cqw); aspect-ratio: 1; padding: 0; border-radius: 9px; border: 1px solid var(--line); background: rgb(11, 16, 22);
    overflow: hidden; opacity: .5; transition: opacity .3s ease, border-color .3s ease, box-shadow .3s ease; }
  .chr .th.on { opacity: 1; border-color: rgba(238, 242, 245, .9); box-shadow: 0 0 9px rgba(var(--fx-glow), .5); }
  .chr .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 地形図は地が明るい：地名も濃い字にする（白い字は読めない） */
  .relief .lbl { color: #1d232b; text-shadow: 0 0 3px rgba(255, 255, 255, .95), 0 0 7px rgba(255, 255, 255, .8); }
  .relief .lbl.zone { color: #8b2a1c; }
  .relief .lbl.eden { color: #2c5a20; }
  .relief .lbl .mk { background: #1d232b; box-shadow: none; }
  .relief .lbl.site .mk { background: #9a6a12; }
  .relief .lbl.zone .mk { background: transparent; border-color: #b8432f; }
  .relief .lbl .rp { background: #1d232b; box-shadow: 0 0 5px rgba(255, 255, 255, .9); }
  .relief .lbl .rp::before, .relief .lbl .rp::after { border-color: rgba(29, 35, 43, .9); }
  /* 降下の映像がまだ届いていないときの表示 */
  #wait { position: absolute; z-index: 1550; left: 50%; bottom: 17%; transform: translateX(-50%); pointer-events: none; opacity: 0; transition: opacity .3s ease;
    font: 300 calc((max(10px, 1.1cqw)) * var(--fs))/1.5 var(--f-jp); letter-spacing: .3em; text-align: center; color: var(--fx-ink); text-shadow: 0 0 6px #000, 0 0 12px #000; }
  #wait small { display: block; font: 300 calc((max(8px, .9cqw)) * var(--fs))/1.4 var(--f-data); letter-spacing: .3em; color: var(--fx-dim); }
  .waiting #wait { opacity: 1; animation: waitp 1.4s ease-in-out infinite; }
  @keyframes waitp { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  /* 世界観の一枚目：星の全体（左に指で回せる球、右に海と陸の割合）。二枚目はこれまでの文章 */
  #sidePage { scroll-snap-type: y proximity; }
  .pg { position: relative; scroll-snap-align: start; }
  .pg.gl { height: 100%; flex-direction: row; align-items: center; gap: 3.2cqw; padding: max(12px, 3.4cqh) 5cqw max(12px, 3.4cqh) 1.6cqw; }
  .glL { position: relative; flex: none; width: min(40cqw, 88cqh); }
  .glL canvas, .glL img { display: block; width: 100%; aspect-ratio: 1; opacity: 0; transition: opacity .9s ease; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .glL canvas { cursor: grab; }
  .glL canvas.drag { cursor: grabbing; }
  .glL canvas.on, .glL img.on { opacity: 1; }
  .glL .hint { position: absolute; left: 0; right: 0; bottom: -.2em; text-align: center; pointer-events: none; font: 300 calc((max(8px, .98cqw)) * var(--fs))/1 var(--f-jp); letter-spacing: .3em; color: var(--fx-dim); }
  .glL .hint .en, .glR .cap .en { font-family: var(--f-data); margin-right: 1.1em; }
  .glR { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: max(6px, 1.7cqh); }
  .glR > * { animation: pgin .6s ease both; }
  .glR .top { display: flex; justify-content: space-between; }
  .glR .big { display: flex; gap: 4.2cqw; margin-top: max(2px, .8cqh); }
  .glR .cap { font: 300 calc((max(8.5px, 1.02cqw)) * var(--fs))/1 var(--f-jp); letter-spacing: .3em; color: var(--fx-dim); margin-bottom: .7cqw; }
  .glR .num { font: 200 calc((clamp(32px, 6cqw, 78px)) * var(--fs))/1 var(--f-label); letter-spacing: .02em; white-space: nowrap; }
  .glR .num i { font-style: normal; font-size: .44em; margin-left: .18em; }
  .glR .say p { font: 300 calc((max(10.5px, 1.3cqw)) * var(--fs))/1.9 var(--f-jp); letter-spacing: .06em; margin: 0; }
  .glR .data { display: grid; grid-template-columns: 1fr 1fr; gap: .5cqw 3.2cqw; }
  .glR .foot { display: flex; flex-wrap: wrap; gap: .5cqw 2.2cqw; padding-right: max(64px, 9cqw); font: 300 calc((max(8px, .95cqw)) * var(--fs))/1.5 var(--f-jp); letter-spacing: .12em; color: var(--fx-dim); margin-top: max(2px, 1cqh); }
  .glR .foot span { display: inline-flex; align-items: center; white-space: nowrap; }
  .glR .foot i { width: .95em; height: .75em; margin-right: .7em; background: rgba(238, 242, 245, .92); }
  .glR .foot .lg1 i { background: rgba(176, 196, 214, .5); }
  .glR .foot .lg2 i { background: rgba(214, 232, 250, .78); }
  /* 下の文章へ／上の球へ */
  .pg .scr { position: absolute; right: 5cqw; appearance: none; border: 0; background: transparent; color: var(--fx-dim); padding: 8px 0 8px 12px; display: flex; align-items: center;
    font: 300 calc((max(8px, .95cqw)) * var(--fs))/1 var(--f-data); letter-spacing: .3em; }
  .pg.gl .scr { bottom: max(6px, 2.2cqh); }
  .pg .scr.up { top: max(8px, 3cqh); }
  .pg .scr i { position: relative; width: 1px; height: 1.9em; margin-left: 1em; background: rgba(238, 242, 245, .6); }
  .pg .scr i::after { content: ''; position: absolute; left: -3px; bottom: 0; width: 6px; height: 6px; border-right: 1px solid rgba(238, 242, 245, .7); border-bottom: 1px solid rgba(238, 242, 245, .7); transform: rotate(45deg); transform-origin: 50% 50%; }
  .pg .scr.up i { transform: scaleY(-1); }
  .pg.gl .scr i { animation: scrn 2.4s ease-in-out infinite; }
  @keyframes scrn { 0%, 100% { transform: none; } 50% { transform: translateY(3px); } }
  .pg.two .cols { margin-top: max(30px, 9cqh); }
  #sidePage { scrollbar-width: none; }
  #sidePage::-webkit-scrollbar { display: none; }
  #flyname { display: none !important; position: absolute; z-index: 1600; right: 14px; top: 14px; font-size: calc((12px) * var(--fs)); letter-spacing: .2em; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 5px 12px; pointer-events: none; }
  .flyend #flyname { display: block; }
  /* ---- 第 14 版：文字はすべて一番細い太さに。地図の画面（地名・ボタン・題）も詳細ページと同じ書体・同じ冷たい白にそろえる ---- */
  :root { --ink: #eef2f5; --panel: rgba(11, 16, 22, .56); --line: rgba(238, 242, 245, .26); }
  html, body { font-family: "Jost", "Noto Sans JP Sub", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; }
  html *, html *::before, html *::after { font-weight: 200 !important; }
  /* 切替ボタン：細い線の四角い枠。選ばれている方は下に細い光の線 */
  .seg { border-radius: 4px; padding: 0 3px; }
  .seg button { position: relative; border-radius: 0; font-size: calc((13px) * var(--fs)); letter-spacing: .16em; padding: 8px 13px 8px; color: rgba(238, 242, 245, .58); }
  .seg button small, #infoBtn small, #back small, #corpx small, #moreBtn small { font-family: var(--f-data); font-size: calc((8px) * var(--fs)); letter-spacing: .22em; margin-top: 4px; opacity: .72; }
  .seg button.on { background: transparent; color: #fff; }
  .seg button.on::after { content: ""; position: absolute; left: 11px; right: 11px; bottom: 3px; height: 1px; background: rgb(var(--fx-glow)); box-shadow: 0 0 6px rgba(var(--fx-glow), .85); }
  #infoBtn, #back, #corpx, #moreBtn { border-radius: 4px; letter-spacing: .16em; }
  #title { background: transparent; border: 0; border-radius: 0; padding: 0; top: 16px; left: 16px; font-size: calc((12px) * var(--fs)); letter-spacing: .32em; color: var(--ink);
    text-shadow: 0 0 3px #000, 0 0 8px rgba(0, 0, 0, .9); }
  #vx { text-shadow: 0 0 3px #000, 0 0 8px rgba(0, 0, 0, .9); }
  #vx small { font-family: var(--f-data); }
  /* 地名：ここだけ一段太く（Jost 400）。下地は敷かず、字そのものの影だけを小さく柔らかく落とす。
     影は文字にだけ付く（下の波紋の点には付けない）。ボタン・題・詳細ページは一番細いまま */
  .lbl, .lbl * { font-weight: 400 !important; }
  .lbl { color: #f8fafc; font-size: calc((12.5px) * var(--fs)); letter-spacing: .14em; text-shadow: 0 0 2px rgba(0, 0, 0, .95), 0 0 4px rgba(0, 0, 0, .85), 0 1px 3px rgba(0, 0, 0, .7); }
  .lbl.area { font-size: calc((13px) * var(--fs)); letter-spacing: .3em; font-style: normal; opacity: 1; }
  .lbl.dot, .lbl.site, .lbl.zone { font-size: calc((12px) * var(--fs)); }
  .lbl.eden { font-size: calc((13.5px) * var(--fs)); color: #e6f7da; letter-spacing: .2em; }
  .lbl.corp { font-size: calc((12.5px) * var(--fs)); letter-spacing: .2em; }
  .lbl.zone { color: #fbdcd2; }
  .lbl .mk { width: 5px; height: 5px; margin-right: 7px; }
  .lbl.zone .mk { width: 6px; height: 6px; border-width: 1.5px; }
  /* 地形（白い模型）の図：明るい地なので暗い字（前からの色）に、白い小さなにじみ。題と左下の注記もここでは一段太く */
  .relief .lbl { color: #141a21; text-shadow: 0 0 2px rgba(255, 255, 255, .95), 0 0 4px rgba(255, 255, 255, .8); }
  .relief #title { color: #1f252d; text-shadow: 0 0 3px rgba(255, 255, 255, .9); }
  .relief #vx { text-shadow: 0 0 3px rgba(255, 255, 255, .9); }
  .relief #title, .relief #vx, .relief #vx * { font-weight: 400 !important; }
  /* 降下後の画面：地表を明るくしたぶん、紹介文の側の暗幕を少し濃く・広く。地図の上に載る注記は地名と同じく一段太く、影は小さく濃く */
  #scrim.right { background: linear-gradient(to right, rgba(8, 12, 18, 0) 36%, rgba(8, 12, 18, .7) 58%, rgba(8, 12, 18, .9) 100%); }
  #scrim.left { background: linear-gradient(to left, rgba(8, 12, 18, 0) 36%, rgba(8, 12, 18, .7) 58%, rgba(8, 12, 18, .9) 100%); }
  .note, .note * { font-weight: 400 !important; }
  .note .en, .note .jp { text-shadow: 0 0 2px rgba(0, 0, 0, .95), 0 0 4px rgba(0, 0, 0, .85), 0 1px 3px rgba(0, 0, 0, .7); }
  .note .jp { color: rgba(238, 242, 245, .9); font-size: calc((10px) * var(--fs)); }
  /* 地形版の降下終点：明るい白い模型の上なので、引き出し線の地名は暗い字と線に（地図の地名と同じ考え方） */
  .relief .note { color: #141a21; }
  .relief .note .en, .relief .note .jp { text-shadow: 0 0 2px rgba(255, 255, 255, .95), 0 0 4px rgba(255, 255, 255, .8); }
  .relief .note .jp { color: rgba(20, 26, 33, .85); }
  .relief .note polyline { stroke: #1d232b; }
  .relief .note svg { filter: drop-shadow(0 0 2px rgba(255, 255, 255, .9)); }
  .relief .note .dot { border-color: #1d232b; box-shadow: 0 0 4px rgba(255, 255, 255, .9); }
  /* ---- 第 16 版：情報欄を開いたら「閉じる」だけ残し、ほかのボタン・題・注記・地名は淡く消す ---- */
  #top, #bottom, #title, #vx, #moreBtn { transition: opacity .4s ease; }
  .corp-open #top, .corp-open #bottom, .corp-open #title, .corp-open #vx, .corp-open #moreBtn { opacity: 0 !important; pointer-events: none !important; }
  .leaflet-marker-pane .lbl, .leaflet-marker-pane .lbl .nm { transition: opacity .4s ease; }
  .corp-open .leaflet-marker-pane .lbl { opacity: 0 !important; pointer-events: none !important; }
  .corp-open .leaflet-marker-pane .sel .lbl { opacity: 1 !important; }
  .corp-open .leaflet-marker-pane .sel .lbl .nm { opacity: 0; }
  /* 情報欄：収まらないときは高さを限って中を滑らせる。字の大きさは変えない */
  #intro > * { flex-shrink: 0; }
  #intro.scroll { overflow: hidden; pointer-events: auto; touch-action: none; cursor: grab; overscroll-behavior: contain; }
  #intro.scroll.more { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 46px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 46px), transparent); }
  #intro.scroll.less { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30px); mask-image: linear-gradient(to bottom, transparent, #000 30px); }
  #intro.scroll.less.more { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30px, #000 calc(100% - 46px), transparent); mask-image: linear-gradient(to bottom, transparent, #000 30px, #000 calc(100% - 46px), transparent); }
  /* 左下の注記は英語一行だけ */
  #vx { font-family: var(--f-data); font-size: calc((10px) * var(--fs)); letter-spacing: .24em; line-height: 1.2; }
  /* ---- 第 17 版：紹介欄の映像（SA の軌道エレベーター）。欄と同じ幅の 16:9、細い枠。高さは padding で先に確保（測ったとき映像がまだ無くても正しい） ---- */
  #intro .clip { position: relative; width: 100%; height: 0; padding-top: 56.25%; overflow: hidden; opacity: 0; pointer-events: auto; cursor: pointer;
    background: rgba(8, 12, 18, .6); }
  #intro .clip video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .6s ease; }
  #intro .clip video.on { opacity: 1; }
  #intro .clip::after { content: ''; position: absolute; left: 0; top: 0; right: 0; bottom: 0; box-shadow: inset 0 0 0 1px rgba(238, 242, 245, .26); pointer-events: none; }
  #intro .clip .tap { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    border: 1px solid rgba(238, 242, 245, .75); background: rgba(8, 12, 18, .35); box-shadow: 0 0 10px rgba(var(--fx-glow), .25); opacity: 0; transition: opacity .3s ease; pointer-events: none; }
  #intro .clip .tap::before { content: ''; position: absolute; left: 17px; top: 13px; border-style: solid; border-width: 9px 0 9px 14px; border-color: transparent transparent transparent rgba(238, 242, 245, .9); }
  #intro .clip.paused .tap { opacity: 1; }
  #intro .cap { font: 300 calc((max(8px, 1.0cqw)) * var(--fs))/1 var(--f-data); letter-spacing: .24em; color: var(--fx-dim); margin-top: -.3cqw; }
  /* ---- 第 18 版：「戻る」一度目の案内（画面中央、2.6 秒） ---- */
  #backHint { position: absolute; left: 50%; top: 50%; z-index: 3000; transform: translate(-50%, -50%) scale(.97); padding: 14px 28px 12px; text-align: center;
    border: 1px solid rgba(238, 242, 245, .32); background: rgba(8, 12, 18, .74); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 0 18px rgba(var(--fx-glow), .12); opacity: 0; pointer-events: none; transition: opacity .35s ease, transform .35s ease; white-space: nowrap; }
  #backHint.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #backHint span { display: block; font: 200 calc((max(13px, 1.5cqw)) * var(--fs))/1.4 var(--f-jp); letter-spacing: .22em; color: var(--fx-ink); }
  #backHint small { display: block; margin-top: 6px; font: 300 calc((max(9px, 1cqw)) * var(--fs))/1 var(--f-data); letter-spacing: .28em; color: var(--fx-dim); }
  /* ---- 第 19 版：ABOUT（菜单の英字は欧文書体、二枚目は小さく淡く、最下段に著作権） ---- */
  #sideMenu button.ab { font-family: var(--f-label); letter-spacing: .24em; }
  .pg.ab1 .scr { bottom: max(6px, 2.2cqh); }
  .pg.ab1 .scr i { animation: scrn 2.4s ease-in-out infinite; }
  .pg.ab2 .cols { grid-template-columns: 1.3fr 1fr; }
  .pg.ab2 .sec h4 { font-size: calc((max(11px, 1.3cqw)) * var(--fs)); }
  .pg.ab2 .sec p { font-size: calc((max(9.5px, 1.02cqw)) * var(--fs)); color: var(--fx-dim); margin-bottom: .35cqw; }
  .pg.ab2 .copy { font: 300 calc((max(8.5px, .95cqw)) * var(--fs))/1 var(--f-data); letter-spacing: .2em; color: var(--fx-dim); padding-top: max(10px, 2cqh); border-top: 1px solid var(--fx-rule); }
  /* ---- 第 23 版：戻るとき、終点画像と引き出し線を一枚にして地図の上に重ねる（縮めずに淡く消える） ---- */
  #map > .backsnap { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 640; pointer-events: none; overflow: hidden; }
  #map > .backsnap > canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  /* ---- 第 24 号补丁：整页不许被浏览器双指放大；颜色不许被浏览器的深色模式改 ---- */
  :root { color-scheme: only light; }
  html, body, #stage { touch-action: none; }
  #map, #map.leaflet-container { touch-action: none !important; }
  #sidePage { touch-action: pan-x pan-y; }

/* ---- 第 25 版：文字大小三档・ボタンを隠す・年を画面の中央に ---- */
:root { --fs: 1; --fb: 1; --fl: 1; }
#top, #bottom, #moreBtn, #title, #vx, #back, #infoBtn, #corpx, #fsRow, #fsSeg2, #fsSeg3, #wait, #msg, #backHint { --fs: var(--fb); }
.lbl, .note { --fs: var(--fl); }
.seg button { padding: calc(8px * var(--fb)) calc(13px * var(--fb)); }
#back, #infoBtn, #corpx { padding: calc(8px * var(--fb)) calc(14px * var(--fb)); }
#moreBtn { padding: calc(7px * var(--fb)) calc(12px * var(--fb)) calc(7px * var(--fb)) calc(15px * var(--fb)); }
/* 右上の一列：文字大小（小・中・大）と、ボタンを隠す目 */
#fsRow { position: absolute; z-index: 1000; right: 14px; top: 10px; display: flex; gap: 6px; align-items: stretch; }
.fsSeg { display: flex; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.fsSeg button { appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: rgba(238, 242, 245, .58); font: inherit; line-height: 1; position: relative;
  min-width: calc(26px * var(--fb)); min-height: calc(41px * var(--fb)); padding: 0 calc(4px * var(--fb)); display: flex; align-items: center; justify-content: center; }
.fsSeg button:nth-child(1) { font-size: calc(11px * var(--fb)); }
.fsSeg button:nth-child(2) { font-size: calc(15px * var(--fb)); }
.fsSeg button:nth-child(3) { font-size: calc(20px * var(--fb)); }
.fsSeg button.on { color: #fff; }
.fsSeg button.on::after { content: ""; position: absolute; left: 5px; right: 5px; bottom: 4px; height: 1px; background: rgb(var(--fx-glow)); box-shadow: 0 0 6px rgba(var(--fx-glow), .85); }
#uiEye { appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 4px; padding: 0 calc(11px * var(--fb));
  display: flex; align-items: center; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#uiEye svg { width: calc(22px * var(--fb)); height: calc(22px * var(--fb)); display: block; }
#fsRow .fsSeg, #uiEye, #fsRow { transition: opacity .3s; }
.flying #fsRow, .flyend #fsRow, .corp-open #fsRow, .side-open #fsRow { opacity: 0 !important; pointer-events: none !important; }
.busy #fsRow { pointer-events: none; }
/* 紹介を開いているとき（飛び込みの終点・企業紹介）は、文字大小だけを左下に残す */
#fsSeg2 { position: absolute; z-index: 1600; left: 14px; bottom: 14px; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .45s, visibility 0s linear .45s; }
.flyend #fsSeg2, .corp-open #fsSeg2 { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .6s .3s, visibility 0s; }
.flyend.fly-eden #fsSeg2 { bottom: calc(22px + 14px * var(--fb)); }
.leaving #fsSeg2 { opacity: 0 !important; }
/* 詳細ページでは、左の細い帯の下に縦に並べる */
#fsSeg3 { position: absolute; z-index: 5; left: 3px; bottom: 12px; width: 38px; flex-direction: column; padding: 3px 0; box-sizing: border-box; }
#fsSeg3 button { min-width: 0; min-height: 30px; padding: 0; }
#fsSeg3 button:nth-child(1) { font-size: 11px; } #fsSeg3 button:nth-child(2) { font-size: 15px; } #fsSeg3 button:nth-child(3) { font-size: 20px; }
#fsSeg3 button.on::after { left: 9px; right: 9px; bottom: 2px; }
/* ボタンを隠す：地名は残す。目だけ薄く残り、もう一度触れると戻る */
.uiOff #top, .uiOff #bottom, .uiOff #title, .uiOff #vx, .uiOff #moreBtn, .uiOff #fsRow .fsSeg { opacity: 0 !important; pointer-events: none !important; }
.uiOff #uiEye { opacity: .5; }
.uiOff #uiEye .sl { display: none; }
/* 大きい字で入りきらないとき：題を隠し、切替ボタンを左へ寄せる */
.tightT #title { display: none; }
.tightT #top { left: 14px; transform: none; }
.tightB #bottom { left: 14px; transform: none; }
.tightB #vx { bottom: var(--vxb, 14px); }
/* 紹介の欄：一行ずつ折り返さないので、字が大きいぶん欄を広げ、暗幕も広げる */
#intro { width: min(calc(42% * var(--fs)), 64%); }
[data-fs="1"] #scrim.right { background: linear-gradient(to right, rgba(8, 12, 18, 0) 28%, rgba(8, 12, 18, .7) 50%, rgba(8, 12, 18, .9) 100%); }
[data-fs="1"] #scrim.left { background: linear-gradient(to left, rgba(8, 12, 18, 0) 28%, rgba(8, 12, 18, .7) 50%, rgba(8, 12, 18, .9) 100%); }
[data-fs="2"] #scrim.right { background: linear-gradient(to right, rgba(8, 12, 18, 0) 16%, rgba(8, 12, 18, .7) 40%, rgba(8, 12, 18, .9) 100%); }
[data-fs="2"] #scrim.left { background: linear-gradient(to left, rgba(8, 12, 18, 0) 16%, rgba(8, 12, 18, .7) 40%, rgba(8, 12, 18, .9) 100%); }
.flyend #vx { bottom: 14px !important; }
#intro.left { top: max(9%, calc(24px + 40px * var(--fb))); }
.segR #fsSeg2 { left: auto; right: 14px; bottom: 14px !important; }
/* 字を大きくして欄や釦が地標の文字に重なったら、その地標は消す（「情報」で欄を隠せば出る） */
.note.cov { opacity: 0 !important; }
/* 年：画面の中央に、1.6 倍で */
#yr { right: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); --fs: 1.6; }

/* ---- 第 26 版：多言語 ---- */
html[lang="en"] { --f-jp: var(--f-label); }
html[lang="zh-Hans"] { --f-jp: "Noto Sans JP Sub", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
html[lang="zh-Hant"] { --f-jp: "Noto Sans JP Sub", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
html[lang="ko"] { --f-jp: "Noto Sans JP Sub", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
#langBtn { appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 4px; font: inherit; line-height: 1.1; white-space: nowrap;
  font-size: calc(13px * var(--fb)); letter-spacing: .1em; padding: calc(7px * var(--fb)) calc(12px * var(--fb)); display: flex; flex-direction: column; align-items: center; justify-content: center;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: opacity .3s; }
#langBtn small { display: block; font-size: calc(9px * var(--fb)); letter-spacing: .12em; opacity: .75; margin-top: 2px; }
@container (max-width: 700px) { #langBtn small { display: none; } }
.uiOff #langBtn { opacity: 0 !important; pointer-events: none !important; }
#langMenu { position: absolute; z-index: 1800; right: 14px; top: 60px; min-width: calc(128px * var(--fb)); background: rgba(11, 16, 22, .9); border: 1px solid var(--line); border-radius: 4px; padding: 4px 0;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-6px); transition: opacity .25s, transform .25s, visibility 0s linear .25s; --fs: var(--fb); }
#langMenu.on { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition: opacity .25s, transform .25s, visibility 0s; }
#langMenu button { appearance: none; -webkit-appearance: none; display: block; width: 100%; border: 0; background: transparent; color: rgba(238, 242, 245, .62); font: inherit; text-align: left; white-space: nowrap; position: relative;
  font-size: calc(14px * var(--fb)); letter-spacing: .08em; line-height: 1.2; padding: calc(9px * var(--fb)) calc(16px * var(--fb)) calc(9px * var(--fb)) calc(18px * var(--fb)); }
#langMenu button.on { color: #fff; }
#langMenu button.on::before { content: ""; position: absolute; left: 7px; top: 28%; bottom: 28%; width: 1px; background: rgb(var(--fx-glow)); box-shadow: 0 0 6px rgba(var(--fx-glow), .85); }
.flying #langMenu, .flyend #langMenu, .corp-open #langMenu, .side-open #langMenu, .uiOff #langMenu { opacity: 0 !important; pointer-events: none !important; }
/* 第 27 版：安全区の余白。飛び込みの終点では、余白を暗い色にする */
.ins.flying body, .ins.flyend body { background: #0a0f15 !important; }
/* 第 28 版：終点の「情報」ボタンを目の印に（欄が出ているあいだは斜線つき、隠したら斜線なしで薄く） */
#infoBtn { display: flex; align-items: center; justify-content: center; padding: 0 calc(11px * var(--fb)); }
#infoBtn svg { width: calc(22px * var(--fb)); height: calc(22px * var(--fb)); display: block; }
.noinfo #infoBtn .sl { display: none; }
/* ---- 第 30 版：横に広くて背の低い画面・大きい字での、登場人物と世界観の組み方 ---- */
:root { --fsr: 1; --fsh: 1; }
/* 見出しの大きい字は、読む字ほどは大きくしない（--fsh）。--fk はその欄だけの縮め具合（入りきらないとき fitSide() が下げる） */
.pg .name, .chr .name, #intro .name, .glR .num { --fs: calc(var(--fsh) * var(--fk, 1)); }
.chr .txt, .glR { --fs: calc(var(--fsr) * var(--fk, 1)); }
/* 登場人物：絵の枠は元の絵の縦横比（728×1260）で、高さから幅を決める（広すぎるときだけ 41% で切る）。上半身が全部見える */
.chr .pic { flex: none; width: auto; height: 100%; aspect-ratio: 728 / 1260; max-width: 41%; }
.chr .txt { padding-top: max(14px, 6cqh); }
.chr .name { font: 200 calc(max(18px, min(2.7cqw, 7cqh)) * var(--fs))/1.05 var(--f-label); letter-spacing: .2em; white-space: nowrap; }
.chr .strip { left: calc(var(--picw, 43%) + 2cqw); }
/* 世界観：百分率の数字を小さめに、画面の高さも見る */
.glR .num { font: 200 calc(clamp(26px, min(4.6cqw, 11cqh), 60px) * var(--fs))/1 var(--f-label); }
/* 次のページの矢印：白く、線を長く、淡く光らせる */
.pg .scr { --fs: var(--fb); color: rgba(238, 242, 245, .95); font: 300 calc(max(9.5px, 1.05cqw) * var(--fs))/1 var(--f-data); letter-spacing: .32em; padding: 9px 0 9px 14px; text-shadow: 0 0 8px rgba(var(--fx-glow), .6); }
.pg .scr i { height: 2.7em; margin-left: 1.1em; background: linear-gradient(to bottom, rgba(238, 242, 245, .12), #fff); box-shadow: 0 0 7px rgba(var(--fx-glow), .95); }
.pg .scr i::after { left: -4px; width: 8px; height: 8px; border-right: 1px solid #fff; border-bottom: 1px solid #fff; filter: drop-shadow(0 0 3px rgba(var(--fx-glow), .9)); }
/* ---- 第 31 版：詳細ページは「四辺のものは固定、中央の文字の欄は自分で上下に滑る」（終点の紹介欄と同じ考え方） ---- */
.pg.two, .pg.ab1 { height: 100%; min-height: 0; }
.pg.gl, .pg.ab1 { padding-bottom: var(--rsvB, max(12px, 3.4cqh)); }
.pg.gl .glR { max-height: 100%; }
.glR .foot { padding-right: 0; }
.pg.two .cols { margin-top: var(--rsvT, max(30px, 9cqh)); }
.pg.two .cols, .pg.ab1 .cols { flex: 1; min-height: 0; }
.chr .txt { box-sizing: border-box; height: 100%; padding-bottom: var(--rsvB, 80px); }
.chr .body { flex: 1; min-height: 0; }
/* 滑る欄 */
.vs { overflow: hidden; }
.vs.scroll { pointer-events: auto; touch-action: none; cursor: grab; overscroll-behavior: contain; }
.vs.scroll.more { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 44px), transparent); }
.vs.scroll.less { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 28px); mask-image: linear-gradient(to bottom, transparent, #000 28px); }
.vs.scroll.less.more { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 28px, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(to bottom, transparent, #000 28px, #000 calc(100% - 44px), transparent); }
/* ---- 第 32 版：三つの欄が並べて入りきらないときは、上から下へ一段ずつ（左に見出し、右に本文）。読むときは下へ滑らせるだけ ---- */
.pg .cols.flow { display: flex; flex-direction: column; gap: max(16px, 4cqh); }
.pg .cols.flow .sec { display: grid; grid-template-columns: minmax(8.5em, 23%) 1fr; column-gap: 3.2cqw; align-items: start; flex: none; }
.pg .cols.flow .sec h3 { grid-column: 1; grid-row: 1; margin: .55em 0 .7em; }
.pg .cols.flow .sec h4 { grid-column: 1; grid-row: 2; margin: 0; }
.pg .cols.flow .sec p { grid-column: 2; }
.pg .cols.flow .sec p:last-child { margin-bottom: 0; }
/* ---- 第 33 版：世界観の二枚目は「年代記のように」。三つの時代を左から右へ。いまの時代だけ明るく、次の時代は半分隠して右へ淡く消す ---- */
.pg.two .chron { flex: 1; min-height: 0; display: flex; margin-right: var(--rsvR, 0px); touch-action: none; }
.chron .cwin { flex: 1; min-width: 0; overflow: hidden; --mL: 0%; --mR: 100%;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--mL), #000 var(--mR), transparent 100%); mask-image: linear-gradient(to right, transparent 0, #000 var(--mL), #000 var(--mR), transparent 100%); }
.chron.hasNext .cwin { --mR: 70%; }
.chron.hasPrev .cwin { --mL: 9%; }
.chron .ctrk { display: flex; gap: 5cqw; height: 100%; transition: transform .6s cubic-bezier(.2, .7, .2, 1); will-change: transform; }
.chron .era { flex: 0 0 68%; min-width: 0; display: flex; flex-direction: column; opacity: .3; transition: opacity .5s ease; }
.chron .era.on { opacity: 1; }
/* 時代の名（押すとその時代へ）。下の線が時間の線で、右の時代まで続く */
.chron .eh { appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: var(--fx-ink); text-align: left; position: relative; flex: none; cursor: pointer; white-space: nowrap;
  width: calc(100% + 5cqw); padding: calc(5px * var(--fb)) 0 calc(13px * var(--fb)) 1px; margin: 0 0 calc(12px * var(--fb)); font: 300 calc(max(9.5px, 1.1cqw) * var(--fb))/1 var(--f-data); letter-spacing: .28em; }
.chron .eh::after { content: ""; position: absolute; left: 0; right: 0; bottom: 3px; height: 1px; background: rgba(238, 242, 245, .26); }
.chron .era.past .eh::after { background: rgb(var(--fx-glow)); box-shadow: 0 0 6px rgba(var(--fx-glow), .8); }
.chron .eh i { position: absolute; left: 0; bottom: 0; width: 7px; height: 7px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(238, 242, 245, .75); background: #0b1016; z-index: 1; }
.chron .era.on .eh i { background: #fff; border-color: #fff; box-shadow: 0 0 8px rgba(var(--fx-glow), 1), 0 0 2px #fff; }
.chron .era.past .eh i { background: rgb(var(--fx-glow)); border-color: rgb(var(--fx-glow)); }
.chron .eb { flex: 1; min-height: 0; }
.chron .eb .sec { animation: none; }
/* ---- 第 34 版：時代の名の列と本文の列を別々に動かす（曲線も別）。選んだ時代の名は少し大きく ---- */
.pg.two .chron { flex-direction: column; }
.chron .crail, .chron .cwin { --mL: 0%; --mR: 100%;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--mL), #000 var(--mR), transparent 100%); mask-image: linear-gradient(to right, transparent 0, #000 var(--mL), #000 var(--mR), transparent 100%); }
.chron.hasNext .crail, .chron.hasNext .cwin { --mR: 70%; }
.chron.hasPrev .crail, .chron.hasPrev .cwin { --mL: 9%; }
.chron .crail { flex: none; overflow: hidden; }
.chron .cwin { flex: 1; min-width: 0; min-height: 0; }
/* 一本目：時代の名と時間の線。出だしが速く、きっぱり止まる */
.chron .rtrk { display: flex; gap: 5cqw; transition: transform .95s cubic-bezier(.33, .1, .2, 1); will-change: transform; }          /* 11-16 用户：“时代响应太快了，瞬间吸附一样，没有减速过程”→ 0.5 秒急停改成 0.95 秒、后半段慢慢减速 */
.chron .rtrk .eh { flex: 0 0 68%; width: auto; min-width: 0; padding-top: calc(11px * var(--fb)); color: rgba(238, 242, 245, .34); transition: color .45s ease; }
.chron .rtrk .eh::after { right: -5cqw; }
.chron .rtrk .eh.on { color: #fff; }
.chron .rtrk .eh.past { color: rgba(238, 242, 245, .34); }
.chron .eh span { display: inline-block; transform-origin: 0 100%; transition: transform .95s cubic-bezier(.33, .1, .2, 1); }
.chron .eh.on span { transform: scale(1.22); }
.chron .eh.on i { background: #fff; border-color: #fff; box-shadow: 0 0 8px rgba(var(--fx-glow), 1), 0 0 2px #fff; }
.chron .eh.past i { background: rgb(var(--fx-glow)); border-color: rgb(var(--fx-glow)); }
/* 時間の線の光（11-16 用户：“而且前半部分白光完全没有动画效果”“没有滑动以后白光延续点亮下一个时代的动画”）：
   走过的那一段不再是一下子变亮，而是一道光从上一个点沿着线往右伸过去，伸到下一个点时才把那个点点亮。
   往后走（fwd）：光晚 0.3 秒出发、1.3 秒走完、越到后面越慢（最后那一小段在画面里看得见）；点在光到的时候（1.2 秒）才亮。往回走（back）：光 0.6 秒收回，点马上亮。 */
.chron .eh.past::after { background: rgba(238, 242, 245, .26); box-shadow: none; }
.chron .eh u { position: absolute; left: 0; right: -5cqw; bottom: 3px; height: 1px; pointer-events: none; text-decoration: none; transform: scaleX(0); transform-origin: 0 50%;
  background: linear-gradient(to right, rgb(var(--fx-glow)) 0, rgb(var(--fx-glow)) 82%, #fff 100%); box-shadow: 0 0 7px rgba(var(--fx-glow), .9); transition: transform .6s cubic-bezier(.4, 0, .6, 1); }
.chron .eh.past u { transform: scaleX(1); }
.chron.fwd .eh u { transition: transform 1.3s cubic-bezier(.12, .75, .12, 1) .3s; }
.chron .eh i { transition: background-color .35s ease, border-color .35s ease, box-shadow .5s ease; }
.chron.fwd .eh.on i { transition-delay: 1.2s; }
/* 二本目：本文。少し遅れて出て、ゆっくり止まる */
.chron .ctrk { transition: transform 1.25s cubic-bezier(.3, .1, .15, 1) .08s; }
.chron .era { transition: opacity .8s ease .15s; }
/* ---- 第 35 版：年の後ろに、横に長い影（両端へ向かってゆっくり淡くなり、上下も淡く消える） ---- */
#yr::before { content: ""; position: absolute; z-index: -1; left: 50%; top: 50%; width: max(86cqw, 520px); height: 240%; transform: translate(-50%, -50%); pointer-events: none;
  background: linear-gradient(to right, rgba(5, 9, 14, 0) 0%, rgba(5, 9, 14, 0.035) 12%, rgba(5, 9, 14, 0.12) 24%, rgba(5, 9, 14, 0.3) 36%, rgba(5, 9, 14, 0.5) 45%, rgba(5, 9, 14, 0.6) 50%, rgba(5, 9, 14, 0.5) 55%, rgba(5, 9, 14, 0.3) 64%, rgba(5, 9, 14, 0.12) 76%, rgba(5, 9, 14, 0.035) 88%, rgba(5, 9, 14, 0) 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, rgba(0,0,0,.35) 22%, #000 42%, #000 58%, rgba(0,0,0,.35) 78%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, rgba(0,0,0,.35) 22%, #000 42%, #000 58%, rgba(0,0,0,.35) 78%, transparent 100%); }
.relief #yr::before { background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.035) 12%, rgba(255, 255, 255, 0.12) 24%, rgba(255, 255, 255, 0.3) 36%, rgba(255, 255, 255, 0.5) 45%, rgba(255, 255, 255, 0.6) 50%, rgba(255, 255, 255, 0.5) 55%, rgba(255, 255, 255, 0.3) 64%, rgba(255, 255, 255, 0.12) 76%, rgba(255, 255, 255, 0.035) 88%, rgba(255, 255, 255, 0) 100%); }
/* ---- 第 36 版：安全区は「突き抜け」。地図・暗幕・パネルの地は画面の端まで。端にある釦と文字だけが安全区のぶん内側へ ---- */
:root { --iT: 0px; --iR: 0px; --iB: 0px; --iL: 0px; }
#title { left: calc(14px + var(--iL)); top: calc(12px + var(--iT)); }
#top { top: calc(10px + var(--iT)); }
.tightT #top { left: calc(14px + var(--iL)); }
#fsRow { right: calc(14px + var(--iR)); top: calc(10px + var(--iT)); }
#langMenu { right: calc(14px + var(--iR)); }
#back, #corpx { left: calc(14px + var(--iL)); top: calc(12px + var(--iT)); }
#infoBtn { top: calc(12px + var(--iT)); }
#bottom { bottom: calc(12px + var(--iB)); }
.tightB #bottom { left: calc(14px + var(--iL)); }
#vx { left: calc(14px + var(--iL)); bottom: calc(14px + var(--iB)); }
.tightB #vx { bottom: calc(var(--vxb, 14px) + var(--iB)); }
.flyend #vx { bottom: calc(14px + var(--iB)) !important; }
#moreBtn { right: calc(14px + var(--iR)); bottom: calc(12px + var(--iB)); }
#fsSeg2 { left: calc(14px + var(--iL)); bottom: calc(14px + var(--iB)); }
.flyend.fly-eden #fsSeg2 { bottom: calc(22px + 14px * var(--fb) + var(--iB)); }
.segR #fsSeg2 { left: auto; right: calc(14px + var(--iR)); bottom: calc(14px + var(--iB)) !important; }
#intro { top: calc(9% + var(--iT)); }
#intro.right { right: calc(2.8% + var(--iR)); }
#intro.left { left: calc(2.8% + var(--iL)); top: calc(max(9%, 24px + 40px * var(--fb)) + var(--iT)); }
#wait { bottom: calc(17% + var(--iB)); }
/* 右のパネル：地は端まで、中身だけ避ける。全画面のページでは左の細い帯も避ける */
#sideMenu { right: var(--iR); }

      langBusy = true; btn.style.opacity = '.5';
      try { await window.__wv7setLang(l); try { localStorage.setItem('wv7lang', l); } catch (err) {} window.__wv7applyLang(l); } catch (err) {}          // 取れなければ何も変えない
      langBusy = false; btn.style.opacity = ''; });
    menu.appendChild(b); });
  btn.addEventListener('click', (e) => { e.stopPropagation(); menu.style.top = (row.offsetTop + row.offsetHeight + 6) + 'px'; menu.classList.toggle('on'); });
  document.addEventListener('pointerdown', (e) => { if (menu.classList.contains('on') && !menu.contains(e.target) && !btn.contains(e.target)) menu.classList.remove('on'); }, true);
  if (window.__wv7fs) window.__wv7fs.fit();
})();

// ---- 第 29 版：言語をその場で切り替える（画面の字・字体・ボタンを書き直す。文字データは __wv7setLang が差し替える） ----
window.__wv7applyLang = function (l) {
  LANG = l; document.documentElement.lang = { ja: 'ja', en: 'en', zhs: 'zh-Hans', zht: 'zh-Hant', ko: 'ko' }[l];
  // 字体：前の言語のぶんを外して、この言語のぶんを足す（日本語・英語は足すものがない）
  [...document.head.querySelectorAll('style')].forEach((st) => { if (/noto-sans-(sc|tc|kr)-200-subset/.test(st.textContent) && st.textContent.length < 2500) st.remove(); });
  const f = I18N.fonts[l];
  if (f) { const st = document.createElement('style');
    st.textContent = '@font-face { font-family: "Noto Sans JP Sub"; src: url("' + f.f200 + '") format("woff2"); font-weight: 200; font-display: swap; }\n'
      + '@font-face { font-family: "Noto Sans JP Sub"; src: url("' + f.f400 + '") format("woff2"); font-weight: 400; font-display: swap; unicode-range: ' + f.range400 + '; }';
    document.head.appendChild(st); }
  // ボタンの主な字と、小さい英字（英語のときは英字一行だけ）
  const SM = { pre: 'PRE-WAR', post: 'POST-WAR', top: 'TOP', ob: 'OBLIQUE', color: 'COLOR', relief: 'RELIEF', labels: 'LABELS', more: 'DETAILS', back: 'BACK', close: 'CLOSE', world: 'WORLD', chars: 'CHARACTERS', loading: 'LOADING' };
  const U = I18N.ui[l] || I18N.ui.ja, q = (x) => document.querySelector(x);
  const put = (el, k) => { if (!el || !U[k]) return; const sm = el.querySelector('small');
    [...el.childNodes].forEach((n) => { if (n.nodeType === 3) n.remove(); }); el.insertBefore(document.createTextNode(U[k]), el.firstChild);
    if (sm) sm.textContent = l === 'en' ? '' : SM[k]; };
  put(q('#top [data-v="pre"]'), 'pre'); put(q('#top [data-v="post"]'), 'post'); put(q('#bottom [data-v="top"]'), 'top'); put(q('#bottom [data-v="ob"]'), 'ob');
  put(q('#bottom [data-v="color"]'), 'color'); put(q('#bottom [data-v="relief"]'), 'relief'); put(q('#bottom [data-k="labels"]'), 'labels'); put(q('#moreBtn span'), 'more');
  put(q('#back'), 'back'); put(q('#corpx'), 'close'); put(q('#sideMenu [data-p="world"]'), 'world'); put(q('#sideMenu [data-p="chars"]'), 'chars'); put(q('#wait'), 'loading');
  const bh = q('#backHint'); if (bh) { const a = bh.querySelector('span'), b = bh.querySelector('small'); if (a) a.textContent = U.backhint || a.textContent; if (b) b.textContent = l === 'en' ? '' : 'SWIPE AGAIN TO LEAVE'; }
  // 言語のボタンとメニュー
  const lb = q('#langBtn'); if (lb) lb.firstChild.textContent = I18N.names[l];
  document.querySelectorAll('#langMenu button').forEach((b) => b.classList.toggle('on', b.dataset.l === l));
  if (window.__wv7fs) { window.__wv7fs.fit(); setTimeout(window.__wv7fs.fit, 400); }          // 字幅が変わるので並べ直す（字体が届いたあとにもう一度）
};

// ---- 第 37 版：全画面のボタン ----
(function () {
  const d = document, el = d.documentElement, btn = d.getElementById('fsBtn'); if (!btn) return;
  const can = !!((d.fullscreenEnabled || d.webkitFullscreenEnabled) && (el.requestFullscreen || el.webkitRequestFullscreen));          // できないブラウザ（iPhone の Safari など）では出さない
  if (!can) return;
  const refit = () => { if (window.__wv7fs) { window.__wv7fs.fit(); setTimeout(window.__wv7fs.fit, 300); } };
  const cur = () => d.fullscreenElement || d.webkitFullscreenElement;
  const sync = () => { el.classList.toggle('isFs', !!cur()); refit(); };
  const give = () => { btn.classList.remove('can'); refit(); };          // 「できる」と言いながら実際には入れないとき：ボタンを引っ込める
  d.addEventListener('fullscreenchange', sync); d.addEventListener('webkitfullscreenchange', sync);
  btn.addEventListener('click', (e) => { e.stopPropagation();
    if (cur()) { try { (d.exitFullscreen || d.webkitExitFullscreen).call(d); } catch (err) {} return; }
    try { const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen(); if (p && p.catch) p.catch(give); } catch (err) { give(); return; }
    setTimeout(() => { if (!cur()) give(); }, 1200); });
  btn.classList.add('can'); refit();
})();
</script>
</body>
</html>
